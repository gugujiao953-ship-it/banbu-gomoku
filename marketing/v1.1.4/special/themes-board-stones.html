<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="./special.css"><title>主题棋盘与棋子</title></head><body><main class="sheet">
  <span class="kicker">VISUAL THEMES</span>
  <h1>棋盘与棋子，<br>也可以有自己的风格</h1>
  <p class="lead">棋盘材质和棋子材质可以自由组合，手数、坐标、禁手、书签和最后一步提示会自动适配对比度。</p>
  <section class="theme-gallery">
    <article class="theme-card"><div class="frame"><img src="./screenshots/04-theme-porcelain.png"></div><b>青花瓷</b><small>青白瓷纹 × 青花棋子</small></article>
    <article class="theme-card"><div class="frame"><img src="./screenshots/05-theme-circuit.png"></div><b>电路棋盘</b><small>暗色线路 × 终端字符</small></article>
    <article class="theme-card"><div class="frame"><img src="./screenshots/06-theme-whitejade.png"></div><b>白玉棋盘</b><small>冷静通透 × 黑钻白金</small></article>
  </section>
  <section class="theme-strip">
    <div class="selector"><img src="./screenshots/07-theme-selector.png"></div>
    <div class="theme-copy"><h2>不只是换一个背景</h2><ul><li>10 种棋盘材质，可以单独选择</li><li>10 种棋子风格，可与任意棋盘组合</li><li>多套整体主题、音效、动效和字号设置</li><li>禁手、胜线、AI 推荐点和书签仍保持清晰</li></ul><div class="theme-badges"><span>原木</span><span>青花</span><span>白玉</span><span>胡桃木</span><span>电路</span><span>极简</span></div></div>
  </section>
</main></body></html>
