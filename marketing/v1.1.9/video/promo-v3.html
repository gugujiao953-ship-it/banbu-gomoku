function titleMotion(tt){const k=E.out(p(tt,0,.28));$('#copy').style.opacity=Math.max(.9,k);$('#copy').style.transform=`translate3d(${(1-k)*-34}px,${(1-k)*22}px,0)`}
function screen(sel,tt,{x=0,y=0,s=1,delay=0,dur=.7,rx=0,ry=0,clip=true}={}){const e=$(sel),k=E.out(p(tt,delay,delay+dur));e.style.opacity=k;e.style.transform=`translate3d(${x+(1-k)*80}px,${y+(1-k)*35}px,0) rotateX(${rx*(1-k)}deg) rotateY(${ry*(1-k)}deg) rotateZ(${(1-k)*-2}deg) scale(${.88+k*.12*s})`;if(clip)e.style.clipPath=`inset(0 ${100-k*100}% 0 0)`}
function metric(items,tt){const d=$('#data');items.forEach((it,i)=>{const e=document.createElement('div');e.className='metric'+(it.c?' '+it.c:'');e.innerHTML=`<b>${it.v}</b><span>${it.l}</span>`;d.append(e);const k=E.out(p(tt,.18+i*.1,.48+i*.1));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*26}px)`})}
function routeMotion(tt,on=true){document.querySelectorAll('.route-main,.route-alt').forEach((e,i)=>{const k=on?E.out(p(tt,.12+i*.09,.72+i*.09)):.1;e.style.opacity=k;e.style.strokeDasharray='520';e.style.strokeDashoffset=on?520*(1-k):420})}
function boardMotion(tt){const h=$('#hero'),pulse=$('#pulse'),k=E.out(p(tt,.15,.8));h.style.opacity=1;h.setAttribute('cy',466-230*(1-k));h.style.transform=`scale(${.72+.28*k})`;pulse.style.opacity=tt>.8?1-p(tt,.8,1.35):0;pulse.setAttribute('r',25+110*p(tt,.8,1.35));const d=p(tt,.72,1.8);document.querySelectorAll('.dot').forEach(e=>{const i=Number(e.dataset.i),a=i*.89;e.style.opacity=d*(1-d)*3;e.setAttribute('cx',936+Math.cos(a)*d*260);e.setAttribute('cy',466+Math.sin(a)*d*185)})}
function tokens(list,tt){const root=$('#tokens');list.forEach((v,i)=>{const e=document.createElement('div');e.className='token';e.textContent=v;root.append(e);const k=E.out(p(tt,.1+i*.07,.46+i*.07)),a=i*.82;e.style.opacity=k;e.style.transform=`translate3d(${Math.cos(a)*180*(1-k)}px,${Math.sin(a)*110*(1-k)}px,0) rotate(${(1-k)*-8}deg)`;e.style.left=(i%3)*250+40+'px';e.style.top=Math.floor(i/3)*92+20+'px'})}
function featurePills(list,tt){const root=$('#feature-cloud');list.forEach((v,i)=>{const e=document.createElement('div');e.className='feature-pill'+(i%4===0?' hot':i%4===1?' lime':'');e.textContent=v;root.append(e);const k=E.out(p(tt,.08+i*.07,.38+i*.07));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*22}px)`})}
function chartMotion(tt){const c=$('#chart');c.innerHTML='';c.style.opacity=1;const path='M18 190 C85 140 110 176 160 128 S245 95 282 130 S356 52 405 84 S492 124 545 62 S615 92 660 34';c.append(svg('line',{x1:18,y1:205,x2:660,y2:205,class:'chart-axis'}));c.append(svg('path',{d:path+' L660 205 L18 205 Z',class:'chart-fill'}));const line=svg('path',{d:path,class:'chart-line'});line.style.strokeDasharray='850';line.style.strokeDashoffset=850*(1-E.out(p(tt,.25,1.7)));c.append(line);const x=18+642*p(tt,.32,1.8),y=190-150*p(tt,.32,1.8);c.append(svg('circle',{cx:x,cy:y,r:8,class:'chart-dot'}));for(let i=0;i<4;i++){const tx=svg('text',{x:18+i*205,y:238,class:'chart-label'});tx.textContent=['CALC','REVIEW','WINRATE','CACHE'][i];c.append(tx)}}
function renderFrame(t){t=Math.max(0,Math.min(DURATION,t));const s=sceneAt(t),tt=t-s.a;setText(s);setImages(s);reset();titleMotion(tt);$('#progress i').style.width=(t/DURATION*100)+'%';const dark=!['record','import','image','vcf','appearance'].includes(s.kind);$('#dark').style.opacity=dark?1:0;$('#paper').style.opacity=dark?0:1;$('#coords').style.color=dark?'rgba(244,242,235,.55)':'rgba(11,13,18,.5)';$('#wash').style.opacity=.25+q(tt,0,.5)*.35;$('#grid').style.opacity=dark?.3:.16;
 if(s.kind==='cold'){boardMotion(tt);routeMotion(tt,false)}
 if(s.kind==='index'){featurePills(['KATAGO 随包','专门对弈','图片识谱核对','VCF 训练','整局复盘','独立棋钟','记谱流','后台续算','20 套外观'],tt);boardMotion(tt);routeMotion(tt,true)}
 if(s.kind==='record'){screen('#screenA',tt,{x:70,y:-50,s:.98,ry:-9});boardMotion(tt);routeMotion(tt,true);metric([{v:'6×',l:'BOARD ZOOM'},{v:'STREAM',l:'MAIN + VARIATIONS'},{v:'H8 → K11',l:'MOVE PATH'}],tt)}
 if(s.kind==='branch'){screen('#screenA',tt,{x:120,y:-40,s:1,ry:-11});routeMotion(tt,true);metric([{v:'K11',l:'BRANCH POINT'},{v:'1 + 1',l:'PATH + LONGEST BRANCH'},{v:'BOOKMARK',l:'STUDY STATE'}],tt);tokens(['SET MAIN','SWITCH BACK','EXPAND 06'],tt)}
 if(s.kind==='import'){screen('#screenA',tt,{x:120,y:-30,s:1,ry:-12});tokens(['SGF','LIB','DP','DB','JSON','POS'],tt);metric([{v:'6',l:'FORMATS'},{v:'MULTI',l:'FILES AT ONCE'},{v:'ANDROID',l:'OPEN WITH HALF-STEP'}],tt)}
 if(s.kind==='image'){screen('#screenA',tt,{x:35,y:-20,s:1,ry:-8,delay:0});screen('#screenB',tt,{x:210,y:35,s:1,ry:8,delay:.45});$('#scanline').style.opacity=E.out(p(tt,.2,.55));$('#scanline').style.transform=`translateY(${p(tt,.2,1.7)*610}px)`;metric([{v:'79%',l:'CONFIDENCE'},{v:'8',l:'STONES FOUND'},{v:'4 / 4',l:'BLACK / WHITE'}],tt);tokens(['ALIGN','VERIFY','EDIT','RESTORE ORDER'],tt)}
 if(s.kind==='vcf'){screen('#screenA',tt,{x:10,y:-30,s:1,ry:7});screen('#screenB',tt,{x:260,y:40,s:1,ry:-8,delay:.4});routeMotion(tt,true);metric([{v:'00:45',l:'CHALLENGE CLOCK',c:'red'},{v:'3',l:'FORCED MOVES'},{v:'SAVE',l:'REPEAT TRAINING',c:'lime'}],tt)}
 if(s.kind==='engine'){screen('#screenA',tt,{x:100,y:-30,s:1,ry:-10});metric([{v:'3.2 MB',l:'b10c128 SMALL'},{v:'21.9 MB',l:'b24c256 INT8',c:'lime'},{v:'0.43.02',l:'RAPFI'},{v:'iKataGo',l:'ANALYSIS ONLY',c:'red'}],tt);tokens(['THREADS 16','CACHE 400M','CACHE 1.6G','NATIVE ANDROID'],tt)}
 if(s.kind==='analysis'){screen('#screenA',tt,{x:60,y:-32,s:1,ry:-9});screen('#screenB',tt,{x:310,y:45,s:1,ry:-5,delay:.42});chartMotion(tt);metric([{v:'0.1 s',l:'REFRESH'},{v:'5 → 30',l:'CANDIDATES'},{v:'LOAD',l:'CACHED RESULT',c:'lime'}],tt)}
 if(s.kind==='duel'){screen('#screenA',tt,{x:15,y:-20,s:1,ry:9});screen('#screenB',tt,{x:280,y:35,s:1,ry:-9,delay:.5});routeMotion(tt,true);metric([{v:'4',l:'AI LEVELS'},{v:'0.6 s',l:'THINK BUDGET'},{v:'RESUME',l:'NEXT SESSION',c:'lime'}],tt)}
 if(s.kind==='clock'){screen('#screenA',tt,{x:70,y:-35,s:1,ry:-8});screen('#screenB',tt,{x:320,y:35,s:1,ry:-4,delay:.48});metric([{v:'FISCHER',l:'+30 SEC'},{v:'BRONSTEIN',l:'DELAY'},{v:'BYO',l:'FIXED TIME'},{v:'READ OFF',l:'COUNTDOWN',c:'red'}],tt);$('#clock').style.opacity=0}
 if(s.kind==='appearance'){screen('#screenA',tt,{x:35,y:-25,s:1,ry:-7});screen('#screenB',tt,{x:280,y:35,s:1,ry:8,delay:.42});tokens(['MOTION PREVIEW','MATERIAL','TRANSPARENCY','THEME'],tt);metric([{v:'14',l:'BOARD MATERIALS'},{v:'16',l:'STONE SETS'},{v:'LIVE',l:'FEEDBACK',c:'lime'}],tt)}
 if(s.kind==='notation'){screen('#screenA',tt,{x:110,y:-35,s:1,ry:-9});$('#ring').style.opacity=E.out(p(tt,.35,1));$('#ring').style.transform=`scale(${.78+E.out(p(tt,.35,1))*.22}) rotate(${(1-E.out(p(tt,.35,1)))*-18}deg)`;metric([{v:'3',l:'MENU PAGES'},{v:'6',l:'FIXED SLOTS'},{v:'GOOD / BAD / ?',l:'MOVE MARKS'}],tt)}
 if(s.kind==='resume'){screen('#screenA',tt,{x:35,y:-25,s:1,ry:10});screen('#screenB',tt,{x:280,y:35,s:1,ry:-8,delay:.5});metric([{v:'STOP',l:'BACKGROUND'},{v:'KEEP',l:'POSITION + READOUT',c:'lime'},{v:'CONTINUE',l:'FOREGROUND'}],tt);$('#scanline').style.opacity=E.out(p(tt,.25,.6));$('#scanline').style.transform=`translateY(${p(tt,.25,1.7)*610}px)`}
 if(s.kind==='features'){screen('#screenA',tt,{x:25,y:-36,s:.98,ry:-8});screen('#screenB',tt,{x:180,y:40,s:.98,ry:8,delay:.38});metric([{v:'6',l:'LOCAL RECORDS'},{v:'8',l:'EXPORT FORMATS'},{v:'TREE + NOTES',l:'PRESERVED',c:'lime'}],tt);tokens(['SEARCH','DRAFTS','BATCH','SGF / LIB / JSON'],tt);routeMotion(tt,true)}
 if(s.kind==='end'){const k=E.out(p(tt,.15,1));$('#endMark').style.opacity=k;$('#endMark').style.transform=`scale(${.7+.3*k}) rotate(${(1-k)*-12}deg)`;$('#endNote').style.opacity=k;$('#endNote').style.transform=`translateY(${(1-k)*20}px)`;boardMotion(tt);routeMotion(tt,true)}
 const w=q(tt,0,.3);$('#wipe').style.opacity=tt<.3?(1-w)*.36:0;$('#wipe').style.transform=`translateX(${w*2700-700}px) skewX(-13deg)`;$('#flash').style.opacity=tt<.08?(1-tt/.08)*.06:0;
}
window.__promo={renderFrame,DURATION,FPS,SCENES};renderFrame(0);
</script>
