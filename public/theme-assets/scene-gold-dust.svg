<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- 黑金·金砂瓦片（2026-10-07 三改）：用户「尊贵黑金回到一开始的那个，不过是我们重绘的」。
       旧版是 83×91 瓦片里 1 粒 1px 点（铺开约 40 粒，很稀、很细）；我上一版把它撤到 340×360／5 粒
