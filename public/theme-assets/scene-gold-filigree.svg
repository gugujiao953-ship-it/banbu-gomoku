<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 150" fill="none">
  <!-- 黑金·极简金线（2026-10-07 重画）：用户「那个流光可以，不过这些线条的风格不适合他」——
       黑金是「克制」的贵：不要缠绕的卷草，只要一组**几何**元素。
       细双线 + 中央小菱形 + 两侧短竖记 + 端点小点，一共四样东西。 -->
  <defs>
    <linearGradient id="bgRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2cf72" stop-opacity="0"/>
      <stop offset=".18" stop-color="#f2cf72" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffe9a8" stop-opacity=".9"/>
      <stop offset=".82" stop-color="#f2cf72" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f2cf72" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".92"/>
      <stop offset="1" stop-color="#b8871f" stop-opacity=".72"/>
    </linearGradient>
  </defs>

  <!-- 主横线 + 副细线（两端渐隐） -->
  <path d="M0 96h430" stroke="url(#bgRule)" stroke-width="1.6"/>
  <path d="M0 101h430" stroke="url(#bgRule)" stroke-width=".8" opacity=".55"/>
  <!-- 中央菱形（双层） -->
  <g transform="translate(215 76)">
    <path d="M0 -22 22 0 0 22-22 0Z" stroke="url(#bgFill)" stroke-width="1.4" fill="none"/>
    <path d="M0 -13 13 0 0 13-13 0Z" fill="url(#bgFill)" opacity=".85"/>
    <path d="M0 -30v-10M0 30v10" stroke="url(#bgFill)" stroke-width="1.2" opacity=".7"/>
  </g>
  <!-- 两侧短竖记（各三道，间距递变） -->
  <g stroke="url(#bgFill)" stroke-width="1.2" opacity=".62">
    <path d="M170 66v20M154 70v12M141 72v8"/>
    <path d="M260 66v20M276 70v12M289 72v8"/>
  </g>
  <!-- 端点小点 -->
  <g fill="url(#bgFill)" opacity=".7">
    <circle cx="30" cy="96" r="1.8"/><circle cx="70" cy="96" r="1.3"/>
    <circle cx="400" cy="96" r="1.8"/><circle cx="360" cy="96" r="1.3"/>
  </g>
</svg>
