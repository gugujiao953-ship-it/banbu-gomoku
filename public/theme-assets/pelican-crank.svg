<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 66 430 264" fill="none">
  <!-- 近侧曲柄组（绕中轴 (208,250) 转）：牙盘 + 近侧曲柄 + 近侧踏板。
       ⚠ 2026-10-08 三处修正：
        ① 这里原本还画着一只蹼足（约 x222–252 ／ y242–256，而且位置本来就是错的——
           它不在踏板上，而在曲柄根部附近）。近侧蹼足现在独立成层 pelican-foot.svg；
           两层各画一只＝同一侧两只脚。用户点名的「鹈鹕有四个脚」就是它，已删。
        ② 曲柄原来画成 (208,250)→(226,272)，长度 28.4；而 IK 用的曲柄半径是 22。
           两者不是一个圆：脚比踏板靠内 3.5px。现在曲柄画成**水平指前、长度正好 22**，
           θ=0 时踏板中心＝(230,250)＝IK 的踝（qa/gen-pelican-leg.mjs 自检会打印这个值）。
        ③ 踏板改成以中轴为中心对称的小板：真脚踏是会自转调平的平台，绕中轴转 360° 时
           板面几乎看不出在转（原来 15 长的板只朝一侧伸，转起来像根指针）。
       也刻意不画远侧那套：远侧曲柄/踏板在 pelican-crank-far.svg，画在车架之后。 -->
  <!-- 牙盘：外圈 + 轮毂 + 三根盘辐 -->
  <circle cx="208" cy="250" r="14" stroke="#4a4364" stroke-width="2.6" fill="none"/>
  <circle cx="208" cy="250" r="4" fill="#3a3350"/>
  <path d="M208 250l12-6M208 250l-12-6M208 250v13" stroke="#4a4364" stroke-width="1.6" opacity=".8"/>
  <!-- 近侧曲柄臂（＝半径 R，水平指前）+ 踏板（以踏板中心对称） -->
  <path d="M208 250h22" stroke="#3a3350" stroke-width="4" stroke-linecap="round"/>
  <path d="M223 248h14" stroke="#2c2740" stroke-width="4.5" stroke-linecap="round"/>
</svg>
