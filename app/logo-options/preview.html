<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>半步五子棋打谱 Logo 方案</title>
    <style>
      :root { color: #292620; background: #eeeae2; font-family: system-ui, "Microsoft YaHei", sans-serif; }
      body { max-width: 980px; margin: 0 auto; padding: 32px 20px 48px; }
      h1 { margin: 0 0 8px; font: 700 30px Georgia, serif; }
      p { color: #766f65; line-height: 1.7; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; margin-top: 24px; }
      article { padding: 18px; border: 1px solid #ddd6ca; border-radius: 20px; background: #f9f7f2; box-shadow: 0 8px 24px #554f4412; }
      img { display: block; width: 100%; max-width: 220px; margin: 0 auto 15px; }
      h2 { margin: 0 0 5px; font-size: 16px; }
      code { color: #365e4b; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>半步五子棋打谱 Logo 方案</h1>
    <p>五套均为轻量 SVG，无外部图片依赖。选定后可再将同一方案同步为 Web/PWA 图标和 Android 自适应图标。</p>
    <main class="grid">
      <article><img src="option-a-intersection.svg" alt="方案 A：交叉落子" /><h2>A · 交叉落子</h2><code>option-a-intersection.svg</code></article>
      <article><img src="option-b-half-step.svg" alt="方案 B：半步路径" /><h2>B · 半步路径</h2><code>option-b-half-step.svg</code></article>
      <article><img src="option-c-seal.svg" alt="方案 C：棋印" /><h2>C · 棋印</h2><code>option-c-seal.svg</code></article>
      <article><img src="option-d-dialogue.svg" alt="方案 D：对话棋局" /><h2>D · 对话棋局</h2><code>option-d-dialogue.svg</code></article>
      <article><img src="option-e-inkstone.svg" alt="方案 E：墨玉" /><h2>E · 墨玉</h2><code>option-e-inkstone.svg</code></article>
    </main>
  </body>
</html>
