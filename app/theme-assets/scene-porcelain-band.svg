<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none">
  <!-- 青花瓷影 · 下腹纹样带（ts-near）：回纹 + 缠枝莲 + 宝相花 + 莲瓣足。
       2026-10-09 第四版（定型）。第三版在 4× 放大下暴露两个真缺陷，本版修掉：

       【缺陷 1】主藤在平铺接缝处有**尖角**。
         第三版的手写 S 曲线在 x=480 处收成一段竖直钩（control 480,118 → 端点 480,152），
         而下一块从 x=0 起笔向上 —— 两块的切线方向对不上，接缝处出现锐利折角（放大可见）。
         修法：主藤改成**严格周期函数**——一个周期 240px（π 对应 120px），480 装两个整周期，
         周期函数在 x=0 与 x=480 处函数值与切线天然相同。
         用三次贝塞尔拟合半正弦：峰高 A 时，控制点取 `0.3642w` / `0.6358w`、
         纵坐标取 `1.333A`（由 B(0.5)=0.75·控制纵坐标 反解，使中点为 A）。
         这样接缝处光滑，且波形是"真波浪"而不是手画的歪扭线。

       【缺陷 2】莲瓣足又窄又空，像尖刺不像莲瓣。
         第三版每瓣 48 宽 × 74 高（高宽比 1.54，太瘦），且分水渐变叠了组透明度后
         有效只有 .6→.4，在浅底上几乎看不出填色。
         修法：每瓣改 60 宽 × 62 高（高宽比 1.03，接近真实仰莲的圆钝比例），
         480 正好放 8 瓣；填色改用更实的钴蓝渐变（有效 .78→.58），
         并保留瓣尖的中脉留白线（那是"描白"，与蓝形成对比，正是青花的做法）。

       ## 图形语汇（每一项都对应真实青花，不是随手画的）
       · 回纹（雷纹）：连续方折螺旋，口沿/颈部的标准窄边纹；
       · 缠枝莲：S 形卷草主藤 + 枝头内卷成螺旋 + 枝上对生小叶；
       · 宝相花：外八瓣 → 内六瓣 → 莲蓬心（多层同心），不是实心圆；
       · 莲瓣足：仰莲成排（圆钝拱形 + 中脉描白），瓷器最常见的下腹装饰。

       ## 平铺与缩放约定
       480 一循环；宝相花落在 x=120/360（=1/4 与 3/4，且正好是主藤的零点），
       读作"花从藤上生出"。缩放**一律按高度 + repeat-x**：
       按宽度缩放会让宽屏把整条带放大到糊（那是本轮修的 bug）。 -->
  <defs>
    <!-- 分水：同一片花瓣上深下浅（钴料沉积），这是青花填色的基本手法 -->
    <linearGradient id="pwDivide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5c93" stop-opacity=".88"/>
      <stop offset=".55" stop-color="#4a7cb0" stop-opacity=".7"/>
      <stop offset="1" stop-color="#9dbcd8" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="pwLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fa8" stop-opacity=".92"/>
      <stop offset="1" stop-color="#2b5384" stop-opacity=".74"/>
    </linearGradient>
  </defs>

  <!-- ① 口沿回纹带：双弦纹 + 8 个方折回纹单元 + 分隔点 -->
  <g stroke="url(#pwLine)" stroke-linecap="round">
    <path d="M0 5h480" stroke-width="2.4"/>
    <path d="M0 12h480" stroke-width="1" opacity=".55"/>
  </g>
  <g stroke="url(#pwLine)" stroke-width="1.7" fill="none" stroke-linecap="square" opacity=".7">
    <path d="M5 40h26v-13h-16v5h10"/>
    <path d="M65 40h26v-13h-16v5h10"/>
    <path d="M125 40h26v-13h-16v5h10"/>
    <path d="M185 40h26v-13h-16v5h10"/>
    <path d="M245 40h26v-13h-16v5h10"/>
    <path d="M305 40h26v-13h-16v5h10"/>
    <path d="M365 40h26v-13h-16v5h10"/>
    <path d="M425 40h26v-13h-16v5h10"/>
  </g>
  <g fill="url(#pwLine)" opacity=".45">
    <circle cx="53" cy="36" r="1.4"/><circle cx="113" cy="36" r="1.4"/>
    <circle cx="173" cy="36" r="1.4"/><circle cx="233" cy="36" r="1.4"/>
    <circle cx="293" cy="36" r="1.4"/><circle cx="353" cy="36" r="1.4"/>
    <circle cx="413" cy="36" r="1.4"/><circle cx="473" cy="36" r="1.4"/>
  </g>

  <!-- ② 缠枝莲主藤：严格周期（周期 240，半正弦拟合）。
       峰 y=118 出现在 x=60/300，谷 y=186 出现在 x=180/420，零点 y=152 在 x=0/120/240/360/480。 -->
  <path d="M0 152C44 107 76 107 120 152 164 197 196 197 240 152 284 107 316 107 360 152 404 197 436 197 480 152"
        stroke="url(#pwLine)" stroke-width="3.1" fill="none" stroke-linecap="round" opacity=".85"/>

  <!-- ③ 卷草枝：在峰值向上出枝、谷值向下出枝，枝头内卷成小螺旋（卷草纹的标志） -->
  <g stroke="url(#pwLine)" fill="none" stroke-linecap="round" stroke-width="1.9" opacity=".72">
    <!-- 峰值出枝（x=60 / 300） -->
    <path d="M60 118c-7-19 2-33 17-40 11-5 22 3 20 13-2 8-11 11-17 5"/>
    <path d="M300 118c-7-19 2-33 17-40 11-5 22 3 20 13-2 8-11 11-17 5"/>
    <!-- 谷值出枝（x=180 / 420） -->
    <path d="M180 186c7 19-2 33-17 40-11 5-22-3-20-13 2-8 11-11 17-5"/>
    <path d="M420 186c7 19-2 33-17 40-11 5-22-3-20-13 2-8 11-11 17-5"/>
  </g>
  <!-- 枝上对生小叶（在两处零点旁成对出现） -->
  <g fill="url(#pwLine)" opacity=".58">
    <path d="M86 145c10-9 21-11 31-5-8 11-19 15-31 5Z"/>
    <path d="M86 153c10 9 21 11 31 5-8-11-19-15-31-5Z"/>
    <path d="M326 145c10-9 21-11 31-5-8 11-19 15-31 5Z"/>
    <path d="M326 153c10 9 21 11 31 5-8-11-19-15-31-5Z"/>
    <path d="M206 179c10-9 21-11 31-5-8 11-19 15-31 5Z"/>
    <path d="M206 187c10 9 21 11 31 5-8-11-19-15-31-5Z"/>
    <path d="M446 179c10-9 21-11 31-5-8 11-19 15-31 5Z"/>
  </g>

  <!-- ④ 宝相花（x=120 与 360，正好在主藤零点上；第二朵用 <use> 右移 240 保证节拍一致） -->
  <g id="pwBaoxiang">
    <g fill="url(#pwDivide)">
      <!-- 外八瓣 -->
      <g opacity=".82">
        <path d="M120 96c11 8 16 18 16 28s-5 18-16 26c-11-8-16-16-16-26s5-20 16-28Z"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(45 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(90 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(135 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(22.5 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(67.5 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(112.5 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(157.5 120 124)"/>
      </g>
      <!-- 内六瓣（缩到 0.6，垫在外瓣之上） -->
      <g opacity=".66" transform="translate(120 124) scale(.6) translate(-120 -124)">
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(60 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(120 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(180 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(240 120 124)"/>
        <path d="M120 96c-11 8-16 18-16 28s5 18 16 26c11-8 16-16 16-26s-5-20-16-28Z" transform="rotate(300 120 124)"/>
      </g>
    </g>
    <!-- 花心：莲蓬（留白圆 + 莲子点 + 花蕊须） -->
    <circle cx="120" cy="124" r="8.5" fill="#eef4f9" opacity=".94"/>
    <circle cx="120" cy="124" r="8.5" fill="none" stroke="url(#pwLine)" stroke-width="1.5" opacity=".88"/>
    <g fill="url(#pwLine)" opacity=".82">
      <circle cx="120" cy="120.5" r="1.4"/><circle cx="116.5" cy="124" r="1.4"/>
      <circle cx="123.5" cy="124" r="1.4"/><circle cx="120" cy="127.5" r="1.4"/>
      <circle cx="120" cy="124" r="1.3"/>
    </g>
    <g stroke="url(#pwLine)" stroke-width=".9" opacity=".48">
      <path d="M120 115v-5"/><path d="M129 124h5"/><path d="M120 133v5"/><path d="M111 124h-5"/>
      <path d="M126 118l3.5-3.5"/><path d="M126 130l3.5 3.5"/><path d="M114 130l-3.5 3.5"/><path d="M114 118l-3.5-3.5"/>
    </g>
  </g>
  <use href="#pwBaoxiang" transform="translate(240 0)"/>

  <!-- ⑤ 弦纹界栏（主纹区与莲瓣足之间） -->
  <path d="M0 216h480" stroke="url(#pwLine)" stroke-width="1.6" opacity=".5"/>

  <!-- ⑥ 莲瓣足：8 枚仰莲瓣（每枚 60 宽 × 62 高，圆钝拱形），正好铺满 480。
       瓣内中脉用留白细线（描白），与蓝色填色形成对比——这是青花最典型的手法。 -->
  <g transform="translate(0 222)">
    <g fill="url(#pwDivide)" stroke="url(#pwLine)" stroke-width="1.2" opacity=".8">
      <path d="M0 62C0 32 12 11 30 0c18 11 30 32 30 62Z"/>
      <path d="M60 62C60 32 72 11 90 0c18 11 30 32 30 62Z"/>
      <path d="M120 62C120 32 132 11 150 0c18 11 30 32 30 62Z"/>
      <path d="M180 62C180 32 192 11 210 0c18 11 30 32 30 62Z"/>
      <path d="M240 62C240 32 252 11 270 0c18 11 30 32 30 62Z"/>
      <path d="M300 62C300 32 312 11 330 0c18 11 30 32 30 62Z"/>
      <path d="M360 62C360 32 372 11 390 0c18 11 30 32 30 62Z"/>
      <path d="M420 62C420 32 432 11 450 0c18 11 30 32 30 62Z"/>
    </g>
    <!-- 瓣尖中脉描白 + 瓣底收口 -->
    <g stroke="#eef4f9" stroke-width="1.5" opacity=".52" stroke-linecap="round">
      <path d="M30 54V16"/><path d="M90 54V16"/><path d="M150 54V16"/><path d="M210 54V16"/>
      <path d="M270 54V16"/><path d="M330 54V16"/><path d="M390 54V16"/><path d="M450 54V16"/>
    </g>
    <path d="M0 62h480" stroke="url(#pwLine)" stroke-width="2.2" opacity=".8"/>
  </g>
</svg>
