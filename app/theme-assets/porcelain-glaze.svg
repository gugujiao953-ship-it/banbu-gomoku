<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- 青花瓷影 · 釉面开片底纹（ts-far 的平铺层）。
       2026-10-09 重做：原文件只有 2 个圆 + 2 条线（且只给设置页色卡用），主题实际只靠两团白色径向
       渐变撑场——等于没有瓷器本体，用户说「太简陋」就是这个原因。

       这一层负责**瓷胎本体**：开片（冰裂纹）＋ 极淡的分水晕染。
       开片是真瓷器最易辨认的特征：釉面细密的网状裂纹，走向随机、疏密不均。
       做法＝两组方向不同的短线，交叉成不规则网（不是规则格，规则格一眼是"格纸"不像瓷）。

       ⚠ 必须**无缝平铺**（背景 repeat）：所有线段端点都落在边界上并与对边衔接，
         否则平铺时会出现网格状的接缝（比不做还难看）。
         手法：每条线从一个边界点画到另一个边界点，坐标按 400 取模成对。
         这里用「生成式对偶」：写死 24 条，端点值刻意取在 0/400 边界上。

       ⚠ 颜色用蓝灰（#5b86bd 系）而不是纯黑：青花的裂纹是**釉色渗进开片**，是蓝的。
         透明度压到 .12–.2 —— 它是"底子"，不能抢内容。 -->
  <g stroke="#5b86bd" stroke-linecap="round" fill="none">
    <!-- 主裂：较长、走向偏斜，构成大网格 -->
    <g stroke-width="1.1" opacity=".2">
      <path d="M0 32 C68 44 132 22 196 40 S330 62 400 46"/>
      <path d="M0 118 C54 132 128 108 186 126 S324 152 400 132"/>
      <path d="M0 208 C72 196 140 222 208 204 S332 182 400 200"/>
      <path d="M0 292 C60 306 136 284 198 300 S326 322 400 306"/>
      <path d="M0 368 C76 356 142 380 210 364 S336 344 400 362"/>
      <!-- 纵向主裂（与横向错开相位，避免形成十字） -->
      <path d="M46 0 C58 66 36 134 54 200 S76 336 62 400"/>
      <path d="M152 0 C140 62 164 130 146 198 S124 334 138 400"/>
      <path d="M262 0 C276 68 254 136 272 202 S294 338 280 400"/>
      <path d="M356 0 C344 64 368 132 350 200 S328 336 342 400"/>
    </g>
    <!-- 次裂：短、细、方向更随机，填满网格内部 -->
    <g stroke-width="0.7" opacity=".13">
      <path d="M18 78 C44 92 62 86 84 96"/>
      <path d="M96 148 C122 138 146 150 168 142"/>
      <path d="M204 86 C228 100 250 92 272 104"/>
      <path d="M300 168 C326 156 350 168 374 158"/>
      <path d="M228 254 C252 268 276 260 298 272"/>
      <path d="M60 240 C86 228 108 240 130 230"/>
      <path d="M178 322 C202 336 226 328 248 340"/>
      <path d="M312 300 C338 288 358 300 382 290"/>
      <path d="M104 62 L122 40"/>
      <path d="M246 190 L268 168"/>
      <path d="M158 268 L138 246"/>
      <path d="M348 96 L326 74"/>
      <path d="M74 348 L96 370"/>
      <path d="M296 380 L276 358"/>
      <path d="M212 336 L230 358"/>
    </g>
  </g>
  <!-- 分水晕染：三团极淡的蓝，模拟青花料在釉下洇开的深浅。
       分水（青花填色）是「同一块面积里由深到浅」的层染，不是均匀色块。 -->
  <g fill="#4a7cb0">
    <ellipse cx="96" cy="120" rx="86" ry="62" opacity=".045"/>
    <ellipse cx="300" cy="270" rx="104" ry="76" opacity=".055"/>
    <ellipse cx="200" cy="20" rx="70" ry="48" opacity=".035"/>
    <ellipse cx="360" cy="360" rx="62" ry="52" opacity=".04"/>
  </g>
</svg>
