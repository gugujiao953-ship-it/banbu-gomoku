<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" fill="none">
  <defs>
    <!-- 只有一条渐变，轴向 = 绸的长度方向。stop 的疏密就是"翻面的节奏"。 -->
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="36" y1="318" x2="964" y2="214">
      <stop stop-color="#b0351a"/>
      <stop offset=".17" stop-color="#ef7546"/>
      <stop offset=".38" stop-color="#a8341a"/>
      <stop offset=".545" stop-color="#6b180a"/>
      <stop offset=".615" stop-color="#8f2611"/>
      <stop offset=".80" stop-color="#f07c48"/>
      <stop offset="1" stop-color="#99290f"/>
    </linearGradient>
    <!-- 上边缘的金边：两端淡出，中段最亮 —— 光只在绸"立起来"的那几段网住。 -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="36" y1="300" x2="964" y2="200">
      <stop stop-color="#f5c48c" stop-opacity="0"/>
      <stop offset=".14" stop-color="#ffd2a0" stop-opacity=".7"/>
      <stop offset=".42" stop-color="#ffe0b4" stop-opacity=".82"/>
      <stop offset=".56" stop-color="#d59a6a" stop-opacity=".18"/>
      <stop offset=".84" stop-color="#ffe2b8" stop-opacity=".88"/>
      <stop offset="1" stop-color="#f5c48c" stop-opacity="0"/>
    </linearGradient>
    <!-- 反光必须裁进绸里：不裁的话笔画会露在轮廓外，变成一道"划痕"。 -->
