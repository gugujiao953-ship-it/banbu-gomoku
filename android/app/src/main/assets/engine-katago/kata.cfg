# ============================================================================
# 半步五子棋 · KataGo 旗舰引擎（KataGomo 分支）运行时配置
# ============================================================================
# 来源与依据：
#   · 基线参数照搬 _engine-lab/phone3s.cfg（真机 2026-09-25 验证：对「五子棋分析」
#     App 原班引擎 4:0）
#   · 线程/批大小：2026-09-28 真机实测（速度根因诊断-2026-09-28.md）——
#     上游源码把 ORT 后端的搜索线程与批大小硬编码为 1（setup.cpp:456/:318），
#     cfg 里写什么都没用；本包引擎已打补丁解锁，这两个键从此真的生效：
#       t=1  b=1（旧硬编码行为）  55.1 访问/秒
#       t=16 b=16（本配置）       95.6 访问/秒（+74%）
#     60s 长跑复核：t16 全程 92.9 v/s、热衰减仅 -13%（t8 是 83.2/-25%，t32 掉到 62.6）。
#   · 日志/视角/温度三条吸收 opponent gtp.cfg 的实测教训（日志目录必须存在、
#     胜率视角必须与前端约定一致、温度钉死防抖动）
# ============================================================================

# ---------------------------------------------------------------- 规则
# 默认连珠（有禁手）；worker 每局用 kata-set-rule basicrule 覆盖。
basicRule = RENJU
VCNRule = NOVC
firstPassWin = false

# ---------------------------------------------------------------- 日志
# logDir 相对进程工作目录（插件把 cwd 设为 filesDir/native-katago/，
# 并保证该目录存在——上游在目录缺失时行为不可靠）。
# 三个日志开关一律关闭：logAllGTPCommunication/logSearchInfo 会把每一条 GTP 通信
# 与搜索统计写进 gtp_logs/（长期运行体积无上限），logToStderr 还会把日志并进
# stdout 管道、每行进一次 JS bridge——引擎输出管道是热路径，开着既费 IO 又污染
# 协议流（09-27 排查「引擎不动」时临时开过，已复原为关）。
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = false

# ---------------------------------------------------------------- 视角（关键）
# =SIDETOMOVE ⇒ kata-analyze / kata-genmove_analyze 输出的 winrate 恒为**行棋方视角**
# （谁在走，这个数就是谁的胜率）。前端约定：面板/候选点直接显示这个原值、标签跟着行棋方
# 走；胜率曲线与整局复盘要跨手比较大小，另在 App 里折到黑方视角。
#
# **为什么回到 SIDETOMOVE（2026-09-30 用矩阵实验重标定，推翻 09-29 的结论）**：
# 09-29 那次标定用的局面是「黑四连 + 白走」（盘面 4 黑 3 白，行棋方其实是白），却按
# 「黑走」解读，于是把 0（= 白方即行棋方必败）误读成「黑方胜率 0」，得出
# 「SIDETOMOVE = 对手视角」的错误结论。09-30 用**行棋方无歧义**的局面重测四种取值：
#     未设置 / SIDETOMOVE → 行棋方视角 ✅（已判决局面同样遵守）
#     BLACK → 黑方视角        WHITE → 白方视角
# 即 SIDETOMOVE 就是行棋方视角，与上游文档一致。
#
# 09-29「黑白颠倒」的**真正根因**：cfg 改成了 BLACK 却忘了升 PAYLOAD_VERSION，
# 设备上跑的仍是旧 payload 里的 SIDETOMOVE cfg，而前端已经按「引擎给的就是黑方胜率」
# 透传 —— 白行棋时把白方胜率当黑方显示。
# 因此本次除了把 cfg 改回 SIDETOMOVE，插件还在启动参数里加了
# `-override-config reportAnalysisWinratesAs=SIDETOMOVE` 兜底：
# **cfg 文件新旧、payload 有没有重铺，都不影响视角正确性**。
reportAnalysisWinratesAs = SIDETOMOVE

# ---------------------------------------------------------------- 搜索资源
# 后端：ONNX Runtime CPU（2026-09-28 从 Eigen 换回）。换回的原因见
# 速度根因诊断-2026-09-28.md §2.3：同权重同机实测 ORT 比 Eigen 快 ~1.7×，
# 且 ORT 吃 fp16 权重（Eigen 分支源码直接拒绝 fp16：eigenbackend.cpp:1601）。
# 当初切 Eigen 的依据（「对手持续 100+/秒、我们只有 ~20/秒」）是误诊——
# 真实原因是搜索线程被硬编码为 1，与后端选型无关。
#
#   · numSearchThreads —— **搜索线程**（真正决定吞吐的旋钮）：同时有多少个 NN
#     评估请求在飞，批大小填充率由它决定。本构建已解锁（见上），面板滑杆写的就是它。
#   · backendNumThreads —— ORT intra-op 线程（一次推理内部的并行度）。实测 4 优于
#     8（95.6 vs 86.4 访问/秒），固定为 4，**不随面板变化**。
#   · nnMaxBatchSize —— 一次推理装几个局面。批 16 是实测拐点（批 32 无增益：
#     78.5 vs 78.5）。同样已解锁。
numSearchThreads = 16
nnCacheSizePowerOfTwo = 18
numNNServerThreadsPerModel = 1
nnMaxBatchSize = 16
backendNumThreads = 4
nnMutexPoolSizePowerOfTwo = 2

# ---------------------------------------------------------------- 搜索行为
cpuctExploration = 1.0
cpuctExplorationLog = 0.4
cpuctExplorationBase = 500
nnPolicyTemperature = 1.1
subtreeValueBiasFactor = 0.0
noResultUtilityForWhite = 0.0
noResultUtilityReduce = 0.3
playoutDoublingAdvantage = 0.0

# 前几手给一点温度避免「每局一模一样」，中后盘钉死保证强度与可复现。
# 注：本构建没有 chosenMoveTemperatureHoldoff 键（真机启动会报 "Unused key"），
# 别再写它——TemperatureEarly 的作用区间由上游固定逻辑决定。
chosenMoveTemperature = 0.0
chosenMoveTemperatureEarly = 0.5

# 分析输出 PV 长度（思考面板展示用）
analysisPVLen = 12

# ---------------------------------------------------------------- 对局行为
# 分析器与产品 AI 都不允许认输——落子语义必须单一（回着法，不回 resign）。
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3

# 不做后台思考：手机一次只跑一个引擎，ponder 只会跟前台抢 CPU 加剧降频。
ponderingEnabled = false
maxTimePondering = 120

# 优势时不偷懒——产品要的是强度；「快胜收手」留给用户体感开关再议。
searchFactorWhenWinning = 1.0
searchFactorWhenWinningThreshold = 1.0

# 本地对局（进程内管道）没有网络延迟，缓冲压到 0.1 防止吞掉小预算。
lagBuffer = 0.1

# ---------------------------------------------------------------- 搜索上限
# maxTime 只是硬安全上限；每手真实预算由 worker 用 GTP `time_settings <秒> 0 0`
# 在每次搜索前下发（标定协议 v1：预算 = 档位秒数 − 本机每手固定开销 − 余量）。
# 注意 time_settings 是「重置时钟」语义，每手重发；这里 30s 防的是极端失控。
maxTime = 30
