<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对弈终局弹窗 · 10 套设计</title>
<style>
:root{--bg:#101418;--panel:#181e25;--panel2:#202832;--line:#2c3641;--ink:#eaeef2;--muted:#93a1af;--accent:#6fd1a8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header.lab{padding:16px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#101418ee;backdrop-filter:blur(10px);z-index:50}
header.lab h1{margin:0 0 5px;font-size:16px}
header.lab p{margin:0;color:var(--muted);font-size:12px;max-width:940px}
header.lab .legend{margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
header.lab .legend b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:18px;padding:18px}
@media(max-width:840px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card>header{padding:11px 13px 9px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
.card>header .idx{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:var(--accent);color:#0d1512;display:grid;place-items:center;font-weight:800;font-size:12px}
.card>header h2{margin:0;font-size:13px}
.card>header p{margin:2px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
/* 舞台：模拟真机上的对局界面（棋盘 + 上方信息），终局弹窗盖在它上面 */
.stage{position:relative;flex:1 1 auto;min-height:470px;background:#0d1116;overflow:hidden}
.boardwrap{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:8px;opacity:.9}
.brow{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#8fa0b0}
.bbar{display:flex;gap:6px;align-items:center}
.bbar .pill{padding:3px 8px;border:1px solid #2b3a45;border-radius:99px;font-size:10px;color:#9fb0bf}
.bbar .pill.on{border-color:#6fd1a8;color:#6fd1a8}
.mini{flex:1 1 auto;display:grid;place-items:center;min-height:0}
.mini canvas{display:block;border-radius:8px;box-shadow:0 10px 26px #0008}
.tools{padding:7px 13px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#151b21}
.tools button{min-height:28px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools span{color:var(--muted);font-size:11px}
.note{padding:8px 13px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;gap:12px;flex-wrap:wrap}
.note b{color:var(--ink)}
.note .dot{color:var(--accent)}
</style>
</head><body>
<header class="lab">
  <h1>对弈终局弹窗 · 10 套设计</h1>
  <p>这些是**结算弹窗**的设计（不是棋盘上的落子动效）：赢了/输了/和棋时，盖在棋盘上的那一屏。每套都能切换胜 / 负 / 和三种结局看效果，弹窗里也写了推荐文案。</p>
  <div class="legend">
    <span><b>玩法</b>：每张卡下面点「胜 / 负 / 和」切换结局，点「重播」再看一次入场动画</span>
    <span><b>文案</b>：胜用「绝艺如君天下少」这一路的七言；负用安慰句；和棋用「平分秋色」——五林是这套路子，我们另写</span>
  </div>
</header>
<div class="grid" id="grid"></div>
<script>
/* 共用：一块画好的棋盘背景（终局局面），弹窗盖在它上面 */
const SIZE = 15;
function paintBoard(canvas, line) {
  const size = 300, dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + "px"; canvas.style.height = size + "px";
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  const pad = size * 0.055, cell = (size - pad * 2) / (SIZE - 1);
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, "#e0ba82"); g.addColorStop(1, "#c99b5c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = "rgba(66,48,26,.5)"; ctx.lineWidth = 1;
  for (let i = 0; i < SIZE; i += 1) { const p = pad + i * cell; ctx.beginPath(); ctx.moveTo(pad, p); ctx.lineTo(size - pad, p); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p, pad); ctx.lineTo(p, size - pad); ctx.stroke(); }
  const put = (r, c, player) => {
    const x = pad + c * cell, y = pad + r * cell, rad = cell * 0.44;
    ctx.beginPath(); ctx.arc(x, y + rad * 0.12, rad, 0, Math.PI * 2); ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fill();
    const rg = ctx.createRadialGradient(x - rad * .35, y - rad * .4, rad * .15, x, y, rad);
    if (player === "b") { rg.addColorStop(0, "#5c5c5c"); rg.addColorStop(.55, "#232323"); rg.addColorStop(1, "#0d0d0d"); }
    else { rg.addColorStop(0, "#fff"); rg.addColorStop(.6, "#f4f1e8"); rg.addColorStop(1, "#d8d2c4"); }
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fillStyle = rg; ctx.fill();
  };
  // 一盘结束的样子：黑 H8-I8-J8-K8-L8 五连，白在周围应
  const blacks = [[7,7],[7,8],[7,9],[7,10],[7,11],[6,7],[8,9],[5,8]];
  const whites = [[6,8],[8,8],[6,9],[8,10],[6,10],[9,9],[5,9],[7,6]];
  whites.forEach(([r,c]) => put(r,c,"w")); blacks.forEach(([r,c]) => put(r,c,"b"));
  if (line) { ctx.save(); ctx.strokeStyle = "#c9a24a"; ctx.globalAlpha = .8; ctx.lineWidth = cell * 0.14; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(pad + 7 * cell, pad + 7 * cell); ctx.lineTo(pad + 11 * cell, pad + 7 * cell); ctx.stroke(); ctx.restore(); }
  return { size, pad, cell };
}

/* 文案：胜 / 负 / 和 —— 我们自己的七言，不走五林原句 */
const COPY = {
  won: { poem: "一子落定乾坤朗", sub: "五连既成，此局归你", tag: "胜" },
  lost: { poem: "胜负兵家常有事", sub: "此局暂负，再战可期", tag: "负" },
  draw: { poem: "势均力敌两相持", sub: "平分秋色，各留一手", tag: "和" },
};
const META = { won: { moves: 47, mine: "12:04", theirs: "10:31" }, lost: { moves: 38, mine: "8:12", theirs: "9:40" }, draw: { moves: 62, mine: "15:20", theirs: "15:22" } };

/**
 * 一张卡：棋盘背景 + 一套弹窗。popup(outcome, host) 负责把弹窗放进 host（每次切换都重建，动画从头播）。
 */
function buildCard({ index, title, desc, note, popup }) {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `<header><span class="idx">${index}</span><div><h2>${title}</h2><p>${desc}</p></div></header>
    <div class="stage"><div class="boardwrap">
      <div class="brow"><span>人机对局 · 无禁手</span><span>第 47 手 · 已结束</span></div>
      <div class="bbar"><span class="pill on">初级 · 0.6s</span><span class="pill">rapfi</span><span class="pill">我方 5 分 + 30 秒读秒</span></div>
      <div class="mini"></div>
    </div><div class="layer" data-layer></div></div>
    <div class="note">${note}</div>`;
  const mini = card.querySelector(".mini");
  const canvas = document.createElement("canvas"); mini.appendChild(canvas);
  const layer = card.querySelector("[data-layer]");
  let outcome = "won";
  const render = () => {
    paintBoard(canvas, outcome === "won");
    layer.innerHTML = "";
    const host = document.createElement("div");
    host.className = "pop-host"; host.dataset.outcome = outcome;
    layer.appendChild(host);
    popup(outcome, host, META[outcome], COPY[outcome]);
  };
  const bar = document.createElement("div"); bar.className = "tools";
  bar.innerHTML = `<span>结局：</span><button data-o="won">胜</button><button data-o="lost">负</button><button data-o="draw">和</button><button data-replay>重播</button>`;
  bar.addEventListener("click", (event) => {
    const o = event.target?.dataset?.o;
    if (o) { outcome = o; render(); return; }
    if (event.target?.hasAttribute?.("data-replay")) { const keep = outcome; outcome = "won"; render(); outcome = keep; setTimeout(render, 30); }
  });
  card.appendChild(bar);
  requestAnimationFrame(render);
  return card;
}

/* 弹窗里共用的小件 */
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const statLine = (m) => `<span>共 ${m.moves} 手</span><span>我方 ${m.mine}</span><span>AI ${m.theirs}</span>`;
const actions = (labels) => `<div class="pp-actions">${labels.map(([text, kind]) => `<button class="${kind || ""}" data-act="${text}">${text}</button>`).join("")}</div>`;

const grid = document.getElementById("grid");

/* ★ 选定方向：03 的墨迹国风 + 04 的玻璃卡 UI + 加强动效 ───────────────────── */
grid.appendChild(buildCard({
  index: "★", title: "墨玉玻璃 · 03 × 04 合体（选定）",
  desc: "03 的墨迹晕开与朱红闲章，配上 04 的磨砂玻璃卡：一滴墨从棋盘中心晕开，宣纸色玻璃卡浮起，题诗逐字显现、标题下一笔墨线画出、数据从 0 涨起、最后闲章压下。慢而稳，深浅主题都能用。",
  note: `<span><b>动效</b><span class="dot"> ●</span> 墨滴晕开 → 玻璃卡上浮 → 逐字题诗 → 墨线画出 → 数字滚动 → 闲章压下 + 朱砂飞溅</span><span><b>适合</b> 默认主题 / 国风主题</span>`,
  popup(outcome, host, meta, copy) {
    const chars = [...copy.poem].map((ch, i) => `<i style="--i:${i}">${esc(ch)}</i>`).join("");
    host.innerHTML = `<div class="pp-ig pp-ig--${outcome}">
      <div class="pp-ig-blot"></div>
      <div class="pp-ig-drift"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="pp-ig-card">
        <div class="pp-ig-stampwrap">
          <span class="pp-ig-stamp"><b>${copy.tag}</b><i></i></span>
        </div>
        <b class="pp-ig-poem">${chars}</b>
        <span class="pp-ig-stroke"></span>
        <small class="pp-ig-sub">${esc(copy.sub)}</small>
        <div class="pp-ig-stats">
          <div><small>共</small><b data-count="${meta.moves}">0</b><small>手</small></div>
          <div><small>我方</small><b>${meta.mine}</b></div>
          <div><small>AI</small><b>${meta.theirs}</b></div>
        </div>
        ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
      </div>
    </div>`;
    const target = host.querySelector("[data-count]");
    if (target) {
      const total = Number(target.dataset.count) || 0;
      const started = performance.now();
      const tick = () => {
        const t = Math.min(1, (performance.now() - started - 700) / 520);
        if (t > 0) target.textContent = String(Math.round(total * (1 - Math.pow(1 - t, 3))));
        if (t < 1 && target.isConnected) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  },
}));

/* 01 · 卷轴展开（东方）：竖排卷轴从中间展开，七言诗竖写 */
grid.appendChild(buildCard({
  index: "01", title: "卷轴 · 竖排题诗",
  desc: "弹窗是一幅竖排卷轴，从中间向上下展开；胜用「一子落定乾坤朗」，负用「胜负兵家常有事」。最有古意的一套。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 卷轴展开 + 竖排字逐字显现</span><span><b>文案</b> 竖排七言 + 小字注解</span>`,
  popup(outcome, host, meta, copy) {
    host.innerHTML = `<div class="pp-scroll pp-scroll--${outcome}">
      <div class="pp-scroll-paper">
        <div class="pp-scroll-vert">${esc(copy.poem)}</div>
        <div class="pp-scroll-side"><b>${copy.tag}</b><span>${esc(copy.sub)}</span></div>
        <div class="pp-scroll-stats">${statLine(meta)}</div>
      </div>
      <div class="pp-scroll-actions">${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}</div>
    </div>`;
  },
}));

/* 02 · 对局战报（数据感）：像一份赛后战报，胜负大字 + 关键数据 + 五连回放缩略 */
grid.appendChild(buildCard({
  index: "02", title: "赛后战报 · 数据版",
  desc: "把终局做成一页战报：大字结果 + 手数/用时/关键手数据条，右下角是那五连的缩略图。适合喜欢复盘数据的人。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 数据条从 0 涨到终值 + 五连缩略图描线</span><span><b>适合</b> 数据党、赛后回看</span>`,
  popup(outcome, host, meta, copy) {
    host.innerHTML = `<div class="pp-report pp-report--${outcome}">
      <div class="pp-report-head"><span class="pp-report-tag">${copy.tag}</span><div><b>${esc(copy.poem)}</b><small>${esc(copy.sub)}</small></div></div>
      <div class="pp-report-stats">
        <div><small>总手数</small><b>${meta.moves}</b></div>
        <div><small>我方用时</small><b>${meta.mine}</b></div>
        <div><small>AI 用时</small><b>${meta.theirs}</b></div>
        <div><small>最长连</small><b>5</b></div>
      </div>
      <div class="pp-report-bars"><span style="--w:${Math.min(100, meta.moves * 2)}%"></span><span style="--w:64%"></span><span style="--w:38%"></span></div>
      <svg class="pp-report-line" viewBox="0 0 120 24" aria-hidden="true"><path d="M6 12 H114" stroke-dasharray="108" stroke-dashoffset="108"/><circle cx="6" cy="12" r="4"/><circle cx="33" cy="12" r="4"/><circle cx="60" cy="12" r="4"/><circle cx="87" cy="12" r="4"/><circle cx="114" cy="12" r="4"/></svg>
      ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
    </div>`;
  },
}));

/* 03 · 墨迹晕开（国风）：一滴墨在纸上晕开成结果，闲章落在右下 */
grid.appendChild(buildCard({
  index: "03", title: "墨迹 · 晕开成字",
  desc: "一滴墨从棋盘中心晕开，墨迹里浮出结果与题诗，右下角落一枚朱红闲章。慢、静、有手写感。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 墨滴扩散 + 字迹渐显 + 印章落下</span><span><b>适合</b> 国风主题</span>`,
  popup(outcome, host, meta, copy) {
    host.innerHTML = `<div class="pp-ink pp-ink--${outcome}">
      <div class="pp-ink-blot"></div>
      <div class="pp-ink-body">
        <div class="pp-ink-poem">${esc(copy.poem)}</div>
        <div class="pp-ink-sub">${esc(copy.sub)}</div>
        <div class="pp-ink-stats">${statLine(meta)}</div>
        ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
      </div>
      <div class="pp-ink-seal">${copy.tag}</div>
    </div>`;
  },
}));

/* 04 · 玻璃浮卡（现代）：棋盘虚化，白色玻璃卡浮起来 */
grid.appendChild(buildCard({
  index: "04", title: "玻璃浮卡 · 现代",
  desc: "棋盘压暗虚化，白色磨砂卡片从下方浮起。最通用、最不容易出错的一套，深浅主题都能用。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 棋盘虚化 + 卡片上浮</span><span><b>适合</b> 默认主题</span>`,
  popup(outcome, host, meta, copy) {
    host.innerHTML = `<div class="pp-glass pp-glass--${outcome}">
      <div class="pp-glass-card">
        <span class="pp-glass-badge">${copy.tag}</span>
        <h3>${esc(copy.poem)}</h3><p>${esc(copy.sub)}</p>
        <div class="pp-glass-stats">${statLine(meta)}</div>
        ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
      </div>
    </div>`;
  },
}));

/* 05 · 落子成章（动效向）：五颗棋子依次飞入排成一行，落定后弹出结果 */
grid.appendChild(buildCard({
  index: "05", title: "落子成章 · 五子归位",
  desc: "终局时那五颗棋子依次放大飞入排成一行，最后一颗落定才浮出结果。把「怎么赢的」再演一遍。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 五子依次飞入 + 落定冲击</span><span><b>适合</b> 想看过程</span>`,
  popup(outcome, host, meta, copy) {
    const stones = Array.from({ length: 5 }, (_, i) => `<i style="--i:${i}"></i>`).join("");
    host.innerHTML = `<div class="pp-chain pp-chain--${outcome}">
      <div class="pp-chain-stones">${stones}</div>
      <div class="pp-chain-card">
        <b>${esc(copy.poem)}</b><small>${esc(copy.sub)}</small>
        <div class="pp-chain-stats">${statLine(meta)}</div>
        ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
      </div>
    </div>`;
  },
}));

/* 06 · 极简一行（克制）：只有一行结果 + 一行小字 + 四个动作，没有任何装饰 */
grid.appendChild(buildCard({
  index: "06", title: "极简一行 · 克制",
  desc: "不铺满、不炫技：棋盘上方浮出一条细窄卡片，一行结果一行小字。适合连着下很多局、不想被打断的人。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 细条从上方滑入</span><span><b>适合</b> 连局、快棋</span>`,
  popup(outcome, host, meta, copy) {
    host.innerHTML = `<div class="pp-slim pp-slim--${outcome}">
      <div class="pp-slim-row"><b>${copy.tag}</b><span>${esc(copy.poem)}</span><small>${esc(copy.sub)}</small></div>
      <div class="pp-slim-meta">${statLine(meta)}</div>
      ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
    </div>`;
  },
}));

/* 07 · 霓虹脉冲（电竞）：结果以发光大字砸下，边框扫光 */
grid.appendChild(buildCard({
  index: "07", title: "霓虹脉冲 · 电竞",
  desc: "结果以发光大字砸下来，卡片边缘扫光循环。跟冷色/深色主题最搭，赢的那一下很有冲击力。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 大字砸下 + 边缘扫光 + 粒子</span><span><b>适合</b> 深色主题</span>`,
  popup(outcome, host, meta, copy) {
    const sparks = Array.from({ length: 14 }, (_, i) => `<i style="--a:${(i / 14) * 360}deg;--d:${40 + (i % 4) * 22}px"></i>`).join("");
    host.innerHTML = `<div class="pp-neon pp-neon--${outcome}">
      <div class="pp-neon-sparks">${sparks}</div>
      <div class="pp-neon-card">
        <b class="pp-neon-title">${copy.tag}</b>
        <span class="pp-neon-poem">${esc(copy.poem)}</span>
        <small>${esc(copy.sub)}</small>
        <div class="pp-neon-stats">${statLine(meta)}</div>
        ${actions([["保存本局", "primary"], ["复盘这局"], ["再来一局"], ["完成"]])}
      </div>
    </div>`;
  },
}));

/* 08 · 双栏对照（信息清楚）：左右两边分别写我 / AI 的战绩，中间是结果 */
grid.appendChild(buildCard({
  index: "08", title: "双栏对照 · 我与 AI",
  desc: "左边我方、右边 AI，中间一个大字结果；两边各写用时与手数。信息最清楚的一套，适合认真对局。",
  note: `<span><b>入场</b><span class="dot"> ●</span> 左右两栏对向滑入 + 中间印章式结果</span><span><b>适合</b> 复盘前先看数据</span>`,
  popup(outcome, host, meta, copy) {
    host.innerHTML = `<div class="pp-vs pp-vs--${outcome}">

  0%{width:16px;height:16px;margin:-8px 0 0 -8px;opacity:.95}

.pp-ig-drift{position:absolute;inset:0;pointer-events:none}
.pp-ig-drift i{position:absolute;width:5px;height:5px;border-radius:50%;background:#2a2620;opacity:.14;
  animation:ig-drift 7s ease-in-out infinite;animation-delay:calc(var(--d,0) * 1s)}
.pp-ig-drift i:nth-child(1){left:14%;top:24%;--d:0}
.pp-ig-drift i:nth-child(2){left:78%;top:18%;--d:1.1;width:3px;height:3px}
.pp-ig-drift i:nth-child(3){left:86%;top:62%;--d:2.3}
.pp-ig-drift i:nth-child(4){left:8%;top:70%;--d:3.4;width:7px;height:7px;opacity:.10}
.pp-ig-drift i:nth-child(5){left:52%;top:88%;--d:4.6;width:3px;height:3px}
@keyframes ig-drift{0%,100%{transform:translate(0,0) scale(1);opacity:.10}50%{transform:translate(9px,-14px) scale(1.35);opacity:.20}}
/* 玻璃卡：宣纸色 + 磨砂 + 内高光（04 的形，03 的色） */
.pp-ig-card{position:relative;margin-top:38px;padding:14px 18px 15px;border-radius:20px;
  background:linear-gradient(152deg,rgba(251,247,237,.88),rgba(238,231,215,.80));
  backdrop-filter:blur(16px) saturate(1.12);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 22px 54px #0000005c, inset 0 1px 0 #ffffffd9, inset 0 0 46px #b6a5831c;
  animation:ig-rise .52s cubic-bezier(.2,.82,.24,1) backwards}
@keyframes ig-rise{from{opacity:0;transform:translateY(20px) scale(.94)}}
/* 顶部那道墨痕让开中间的印章：左右两段，不穿过印章 */
.pp-ig-card::before,.pp-ig-card::after{content:"";position:absolute;top:0;height:2px;border-radius:2px;background:#2b2620;opacity:.14}
.pp-ig-card::before{left:16px;width:calc(50% - 62px)}
.pp-ig-card::after{right:16px;width:calc(50% - 62px)}
/* 顶部居中：一枚大印压在卡片上沿（压印动画 + 一圈朱砂飞溅都在这里）。
   04 的形是「徽标居中在顶、下面一排信息」，03 的魂是这枚印——两者合一。 */
.pp-ig-stampwrap{display:flex;justify-content:center;margin:-38px 0 12px}
.pp-ig-stamp{position:relative;width:64px;height:64px;display:grid;place-items:center;border-radius:15px;
  background:linear-gradient(160deg,#c04234,#9d2f24);color:#fff4e2;
  box-shadow:0 14px 30px #7d241b5c, inset 0 0 0 3px #ffffff2e;
  animation:ig-stamp .55s .34s cubic-bezier(.2,.9,.3,1.3) backwards}
.pp-ig--lost .pp-ig-stamp{background:linear-gradient(160deg,#5b6470,#414a55);box-shadow:0 14px 30px #2b313a66, inset 0 0 0 3px #ffffff24}
.pp-ig--draw .pp-ig-stamp{background:linear-gradient(160deg,#9a7a3f,#7d6130);box-shadow:0 14px 30px #6b522066, inset 0 0 0 3px #ffffff24}
@keyframes ig-stamp{from{opacity:0;transform:scale(2.5) rotate(-9deg)}to{opacity:1;transform:none}}
.pp-ig-stamp b{font:800 30px/1 "Songti SC",serif;font-style:normal}
.pp-ig-stamp i{position:absolute;inset:-5px;border-radius:19px;border:2px solid #c0423466;opacity:0;
  animation:ig-splash .75s .5s ease-out forwards}
.pp-ig--lost .pp-ig-stamp i{border-color:#5b647066}
.pp-ig--draw .pp-ig-stamp i{border-color:#9a7a3f66}
@keyframes ig-splash{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.95);opacity:0}}
/* 以下全部居中（04 的排版） */
.pp-ig-poem{display:block;text-align:center;font:700 19px/1.5 "Songti SC",serif;color:#26221b;letter-spacing:.06em}
.pp-ig-poem i{display:inline-block;font-style:normal;opacity:0;animation:ig-char .42s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:calc(360ms + var(--i) * 58ms)}
@keyframes ig-char{from{opacity:0;transform:translateY(7px) scale(.9);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.pp-ig-stroke{display:block;height:3px;margin:9px auto 7px;border-radius:3px;width:min(78%,220px);
  background:linear-gradient(90deg,transparent,#332d24 8%,#332d24 92%,transparent);
  transform-origin:center;transform:scaleX(0);animation:ig-stroke .62s .92s cubic-bezier(.3,.8,.3,1) forwards;opacity:.72}
@keyframes ig-stroke{to{transform:scaleX(1)}}
.pp-ig-sub{display:block;text-align:center;color:#6d6555;font-size:11px;animation:ig-fade .5s 1.05s ease-out backwards}
.pp-ig-stats{display:flex;gap:8px;margin-top:13px}
.pp-ig-stats>div{flex:1 1 0;display:flex;align-items:baseline;justify-content:center;gap:3px;padding:8px 6px;
  border:1px solid #00000014;border-radius:11px;background:#ffffff5c;font-variant-numeric:tabular-nums;
  animation:ig-fade .45s ease-out backwards}
.pp-ig-stats>div:nth-child(1){animation-delay:1.1s}
.pp-ig-stats>div:nth-child(2){animation-delay:1.18s}
.pp-ig-stats>div:nth-child(3){animation-delay:1.26s}
.pp-ig-stats small{color:#7a7263;font-size:10px}
.pp-ig-stats b{color:#26221b;font-size:15px;font-weight:800}
.pp-ig .pp-actions{margin-top:13px;animation:ig-fade .45s 1.36s ease-out backwards}
.pp-ig .pp-actions button{border-color:#0000001f;background:#ffffff9e;color:#3b3529;position:relative;overflow:hidden;transition:transform .16s ease-out}
.pp-ig .pp-actions button::after{content:"";position:absolute;left:50%;bottom:-14px;width:8px;height:8px;margin-left:-4px;border-radius:50%;
  background:#2b2620;opacity:0;transition:opacity .2s}
.pp-ig .pp-actions button:hover{transform:translateY(-1px)}
.pp-ig .pp-actions button:hover::after{opacity:.10;animation:ig-btn .5s ease-out forwards}
@keyframes ig-btn{from{transform:scale(1)}to{transform:scale(9)}}
.pp-ig .pp-actions button.primary{background:linear-gradient(160deg,#c04234,#9d2f24);border-color:#9d2f24;color:#fff4e2}
.pp-ig .pp-actions button.primary::after{background:#fff}

</style>
