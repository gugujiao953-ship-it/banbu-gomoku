<!doctype html>
<html lang="zh-CN" data-surface="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>棋盘外观探索 · 100 个动效主题</title>
<style>
/* ============================================================
   Board Appearance Exploration Gallery
   A standalone design sandbox: 100 animated board + stone themes.
   Not part of the app build. Classic scripts only (file:// friendly).
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --page:#0e1013; --page-2:#16191e; --card:#1b1f25; --card-edge:#2a3038;
  --ink:#f2efe8; --muted:#9aa3ad; --accent:#7fb08c; --accent-soft:#274233;
  --radius:18px;
  --font-ui:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-display:Georgia,"Songti SC","Noto Serif SC",serif;
}
html[data-surface="light"]{
  --page:#f4f1ea; --page-2:#ece7dd; --card:#ffffff; --card-edge:#ded6c8;
  --ink:#241f18; --muted:#6d6659; --accent:#3f6b50; --accent-soft:#dce9df;
}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 700px at 12% -10%, #24333a55, transparent 60%),
    radial-gradient(900px 600px at 92% 0%, #3a2b3f55, transparent 55%),
    var(--page);
  color:var(--ink); font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
html[data-surface="light"] body{background:
    radial-gradient(1100px 700px at 10% -10%, #dce9df88, transparent 60%),
    radial-gradient(900px 600px at 95% 0%, #efe3d388, transparent 55%), var(--page);}

/* ---------- page chrome ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:38px 26px 90px}
.masthead{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.masthead h1{font:400 clamp(30px,4.4vw,52px)/1.05 var(--font-display);letter-spacing:.01em;margin:0 0 10px}
.masthead h1 em{font-style:normal;color:var(--accent)}
.masthead p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.7;max-width:64ch}
.counter{font:600 12px/1 var(--font-ui);color:var(--muted);letter-spacing:.22em;text-transform:uppercase}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 30px;position:sticky;top:0;z-index:20;
  padding:12px 14px;border:1px solid var(--card-edge);border-radius:16px;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(14px);box-shadow:0 18px 40px #0004}
.chip{border:1px solid var(--card-edge);background:transparent;color:var(--ink);font:600 11.5px/1 var(--font-ui);
  padding:8px 12px;border-radius:999px;cursor:pointer;transition:.18s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.ghost{border-style:dashed}
.sep{width:1px;height:22px;background:var(--card-edge);margin:0 4px}
.toolbar .grow{flex:1}

/* ---------- gallery ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:20px}
@media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:13px}.wrap{padding:24px 14px 70px}}

.card{
  border:1px solid var(--card-edge);border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--card) 96%,transparent),var(--card));
  box-shadow:0 12px 30px #0003;opacity:0;transform:translateY(14px);
}
.card.shown{animation:card-in .6s cubic-bezier(.22,.9,.24,1) forwards}
@keyframes card-in{to{opacity:1;transform:none}}
.card figcaption{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px}
.card .no{font:700 10px/1 var(--font-ui);letter-spacing:.2em;color:var(--muted)}
.card b{font:400 15px/1.25 var(--font-display);letter-spacing:.02em}
.card small{color:var(--muted);font-size:11px;line-height:1.5}
.card .fam{align-self:flex-start;font:600 9.5px/1 var(--font-ui);letter-spacing:.12em;color:var(--accent);
  background:var(--accent-soft);padding:4px 7px;border-radius:6px;text-transform:uppercase}

/* ---------- board shell ---------- */
.board{position:relative;aspect-ratio:1/1;isolation:isolate;overflow:hidden;--n:9;--pad:7;--cell:calc((100% - var(--pad)*2%) / (var(--n) - 1))}
.board .bd-layer,.board .bd-grain,.board .bd-glow{position:absolute;inset:0}
.board .bd-layer{background:linear-gradient(140deg,var(--bd-1,#111),var(--bd-2,#333));z-index:0}
.board .bd-grain{z-index:1;mix-blend-mode:var(--grain-blend,overlay);opacity:var(--grain-opacity,.5)}
.board .bd-glow{z-index:2;pointer-events:none}
.board .lines{position:absolute;inset:var(--pad);z-index:3;
  background-image:
    repeating-linear-gradient(to right,var(--ln,#0009) 0 1px,transparent 1px var(--cell)),
    repeating-linear-gradient(to bottom,var(--ln,#0009) 0 1px,transparent 1px var(--cell));
  background-size:var(--cell) var(--cell);
  filter:var(--line-filter,none)}
.board .frames{position:absolute;inset:var(--pad);z-index:3;border:var(--frame-w,0) solid var(--frame,#0004)}
.board .star{position:absolute;width:var(--star-size,4.2%);aspect-ratio:1;border-radius:50%;background:var(--star,#000a);
  transform:translate(-50%,-50%);z-index:4;box-shadow:var(--star-glow,0 0 0 transparent)}
.board .stones{position:absolute;inset:0;z-index:5}

/* stone base */
.stone{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  width:calc(var(--cell) * var(--stone-scale,.86));aspect-ratio:1;
  transition:.2s}
.stone.black{background:radial-gradient(circle at 34% 28%,var(--s-black-2,#6a6a6a),var(--s-black,#111) 62%)}
.stone.white{background:radial-gradient(circle at 34% 28%,#fff,var(--s-white,#e8e4da) 66%)}
.stone .core{position:absolute;inset:0;border-radius:50%}

/* adaptive edge: the renderer adds .edge-black/.edge-white when a stone would
   otherwise sink into the board base (dark boards swallow black stones). The
   rim colour follows --glow when it is bright enough, else falls back. */
.stone.edge-black{box-shadow:0 0 0 1.7px var(--edge-black,#ffffff9e),0 2px 10px #00000059}
.stone.edge-white{box-shadow:0 0 0 1.2px var(--edge-white,#0000003d),0 3px 9px #00000030}

/* ============================================================
   BOARD MATERIALS  .bd-*
   ============================================================ */
/* — wood / bamboo — */
.bd-wood .bd-grain{background:
  repeating-linear-gradient(96deg,#0000 0 5px,#00000012 5px 6px,#0000 6px 13px,#ffffff0e 13px 14px),
  repeating-linear-gradient(90deg,#0000 0 22px,#0000000e 22px 24px)}
.bd-wood-fine .bd-grain{background:
  repeating-linear-gradient(90deg,#0000 0 3px,#00000014 3px 4px),
  repeating-linear-gradient(0deg,#0000 0 26px,#ffffff10 26px 27px)}
.bd-bamboo .bd-grain{background:
  repeating-linear-gradient(90deg,#0000 0 8px,#00000018 8px 9px,#0000 9px 17px),
  repeating-linear-gradient(0deg,#0000 0 34px,#00000020 34px 35px)}

/* — paper / print — */
.bd-paper .bd-grain{background:
  radial-gradient(circle at 20% 30%,#00000010 0 1.2px,transparent 1.6px) 0 0/7px 7px,
  radial-gradient(circle at 70% 65%,#0000000e 0 1px,transparent 1.4px) 3px 4px/9px 9px,
  linear-gradient(120deg,#ffffff26,#0000000a)}
.bd-newsprint .bd-grain{background:
  repeating-linear-gradient(0deg,#00000014 0 1px,transparent 1px 3px),
  radial-gradient(circle at 40% 40%,#00000012 0 1px,transparent 1.5px) 0 0/5px 5px}
.bd-riso .bd-grain{background:
  radial-gradient(circle at 50% 50%,#ff3d7f33 0 1.4px,transparent 1.8px) 0 0/6px 6px,
  radial-gradient(circle at 20% 80%,#00b7ff2e 0 1.4px,transparent 1.8px) 3px 3px/7px 7px}

/* — ceramic / lacquer / metal — */
.bd-porcelain .bd-glow{background:
  linear-gradient(115deg,#ffffff00 30%,#ffffff5c 46%,#ffffff00 62%)}
.bd-lacquer .bd-glow{background:
  radial-gradient(120% 80% at 18% 6%,#ffffff2e,transparent 55%),
  linear-gradient(100deg,#ffffff00 42%,#ffffff24 50%,#ffffff00 58%)}
.bd-bronze .bd-grain{background:
  radial-gradient(circle at 30% 40%,#7fd4c01f 0 2px,transparent 2.6px) 0 0/11px 11px,
  radial-gradient(circle at 70% 70%,#2f6f5f24 0 1.6px,transparent 2.2px) 5px 6px/13px 13px,
  linear-gradient(160deg,#ffffff1c,#00000022)}
.bd-gold .bd-grain{background:
  linear-gradient(78deg,#fff2b800 20%,#fff6c866 34%,#fff2b800 48%),
  radial-gradient(circle at 60% 30%,#8a6b1c33 0 1.5px,transparent 2px) 0 0/9px 9px,
  repeating-linear-gradient(115deg,#0000 0 9px,#00000016 9px 10px)}
.bd-chrome .bd-glow{background:linear-gradient(155deg,#ffffff66 12%,#ffffff00 34%,#ffffff4d 52%,#ffffff00 70%)}

/* — stone / jade / crystal — */
.bd-stone .bd-grain{background:
  radial-gradient(circle at 25% 35%,#ffffff0f 0 1.4px,transparent 2px) 0 0/8px 8px,
  radial-gradient(circle at 65% 70%,#0000001c 0 1.8px,transparent 2.4px) 4px 5px/11px 11px}
.bd-marble .bd-grain{background:
  linear-gradient(112deg,#0000 34%,#ffffff33 40%,#0000 43%),
  linear-gradient(96deg,#0000 58%,#00000018 61%,#0000 65%),
  linear-gradient(126deg,#0000 72%,#ffffff20 76%,#0000 79%)}
.bd-jade .bd-glow{background:
  radial-gradient(60% 45% at 30% 28%,#ffffff4d,transparent 60%),
  radial-gradient(70% 55% at 74% 76%,#26ffc01f,transparent 60%)}
.bd-crystal .bd-grain{background:
  conic-gradient(from 210deg at 30% 20%,#ffffff2e,#ffffff00 22%,#ffffff26 40%,#00000000 58%,#ffffff1f 74%,#ffffff00)}
.bd-ice .bd-grain{background:
  linear-gradient(58deg,#0000 44%,#ffffff40 47%,#0000 50%),
  linear-gradient(128deg,#0000 30%,#bfe9ff33 34%,#0000 37%),
  radial-gradient(circle at 72% 26%,#ffffff33 0 2px,transparent 2.6px) 0 0/13px 13px}

/* — ink / water — */
.bd-ink .bd-glow{background:
  radial-gradient(58% 46% at 26% 30%,#0c0c0c55,transparent 62%),
  radial-gradient(46% 38% at 76% 72%,#0c0c0c3d,transparent 60%),
  radial-gradient(70% 60% at 50% 50%,#ffffff0f,transparent 70%)}
.bd-ocean .bd-glow{background:
  linear-gradient(180deg,#eaffff2b 0%,#ffffff00 30%),
  repeating-linear-gradient(92deg,#ffffff00 0 13px,#ffffff12 13px 15px,#ffffff00 15px 30px)}

/* — digital / neon — */
.bd-grid-neon .bd-glow{background:
  repeating-linear-gradient(to right,#00f0ff00 0 17px,#00f0ff4d 17px 18px),
  repeating-linear-gradient(to bottom,#ff00c800 0 17px,#ff00c84d 17px 18px);
  opacity:.5}
.bd-holo .bd-glow{background:linear-gradient(115deg,#ff5ea84d,#ffd45e4d 25%,#5effc04d 50%,#5ec8ff4d 75%,#c05eff4d);opacity:.75}
.bd-circuit .bd-grain{background:
  linear-gradient(90deg,#0000 0 24px,#7fffd433 24px 25px,#0000 25px 48px),
  linear-gradient(0deg,#0000 0 30px,#7fffd426 30px 31px,#0000 31px 60px),
  radial-gradient(circle at 48px 24px,#7fffd466 0 2px,transparent 2.6px) 0 0/48px 60px}
.bd-pixel .bd-grain{background:
  repeating-linear-gradient(0deg,#ffffff0a 0 6px,#00000014 6px 12px),
  repeating-linear-gradient(90deg,#ffffff08 0 6px,#00000010 6px 12px)}
.bd-blueprint .bd-grain{background:
  repeating-linear-gradient(0deg,#ffffff1f 0 1px,transparent 1px 14px),
  repeating-linear-gradient(90deg,#ffffff1f 0 1px,transparent 1px 14px)}
.bd-mesh .bd-glow{background:
  radial-gradient(50% 50% at 18% 22%,#ff8a5c4d,transparent 65%),
  radial-gradient(46% 46% at 82% 26%,#5cc8ff4d,transparent 65%),
  radial-gradient(52% 52% at 50% 86%,#c05eff42,transparent 66%)}

/* — nature / weather — */
.bd-star .bd-grain{background:
  radial-gradient(circle at 18% 26%,#fff 0 1px,transparent 1.4px) 0 0/26px 26px,
  radial-gradient(circle at 64% 72%,#fff9 0 .9px,transparent 1.3px) 7px 11px/34px 34px,
  radial-gradient(circle at 84% 34%,#ffffffcc 0 1.2px,transparent 1.6px) 13px 5px/44px 44px}
.bd-nebula .bd-glow{background:
  radial-gradient(52% 44% at 30% 36%,#8a5cff5c,transparent 66%),
  radial-gradient(44% 40% at 74% 62%,#ff5ca84d,transparent 64%),
  radial-gradient(60% 50% at 52% 84%,#5cd8ff42,transparent 68%)}
.bd-aurora .bd-glow{background:
  linear-gradient(102deg,#3affc000 8%,#3affc05c 26%,#5c9bff5c 44%,#c05cff4d 62%,#3affc000 84%)}
.bd-lava .bd-grain{background:
  linear-gradient(68deg,#0000 46%,#ff7a2a66 48%,#0000 51%),
  linear-gradient(132deg,#0000 32%,#ff3d0066 35%,#0000 39%),
  radial-gradient(circle at 66% 74%,#ffb03a55 0 3px,transparent 4px) 0 0/22px 22px}
.bd-sand .bd-grain{background:
  repeating-radial-gradient(circle at 30% 110%,#0000 0 12px,#00000012 12px 14px,#0000 14px 26px)}
.bd-sakura .bd-grain{background:
  radial-gradient(circle at 24% 30%,#ffb7cf99 0 2.4px,transparent 3.2px) 0 0/29px 29px,
  radial-gradient(circle at 68% 66%,#ffd0e0aa 0 1.8px,transparent 2.6px) 11px 7px/37px 37px}
.bd-moss .bd-grain{background:
  radial-gradient(circle at 30% 40%,#4d7a3a66 0 3px,transparent 4px) 0 0/17px 17px,
  radial-gradient(circle at 72% 68%,#2f5c2a55 0 2.4px,transparent 3.2px) 8px 5px/23px 23px}

/* — fabric / textile — */
.bd-linen .bd-grain{background:
  repeating-linear-gradient(0deg,#0000000f 0 1px,transparent 1px 4px),
  repeating-linear-gradient(90deg,#0000000f 0 1px,transparent 1px 4px)}
.bd-silk .bd-grain{background:
  repeating-linear-gradient(58deg,#ffffff14 0 3px,#0000 3px 7px),
  linear-gradient(108deg,#ffffff00 36%,#ffffff30 48%,#ffffff00 60%)}
.bd-velvet .bd-glow{background:
  radial-gradient(70% 60% at 30% 20%,#ffffff1f,transparent 62%),
  radial-gradient(80% 70% at 70% 90%,#00000042,transparent 66%)}
.bd-carbon .bd-grain{background:
  repeating-linear-gradient(45deg,#ffffff0f 0 3px,#0000 3px 6px,#00000026 6px 9px,#0000 9px 12px)}
.bd-terrazzo .bd-grain{background:
  radial-gradient(circle at 20% 30%,#ffffff66 0 2px,transparent 2.8px) 0 0/19px 19px,
  radial-gradient(circle at 62% 74%,#00000040 0 2.4px,transparent 3.2px) 7px 9px/27px 27px,
  radial-gradient(circle at 84% 44%,#8a8a8a4d 0 1.8px,transparent 2.4px) 13px 3px/23px 23px}

/* — decorative / art movements — */
.bd-kintsugi .bd-grain{background:
  linear-gradient(74deg,#0000 42%,#ffd982cc 43%,#0000 44%),
  linear-gradient(118deg,#0000 66%,#ffd98299 67%,#0000 68%),
  linear-gradient(28deg,#0000 24%,#ffd98277 25%,#0000 26%)}
.bd-artdeco .bd-grain{background:
  repeating-linear-gradient(45deg,#d4af3722 0 2px,transparent 2px 14px),
  repeating-linear-gradient(-45deg,#d4af3722 0 2px,transparent 2px 14px)}
.bd-bauhaus .bd-grain{background:
  radial-gradient(circle at 22% 26%,#e6394699 0 14%,transparent 15%),
  radial-gradient(circle at 78% 74%,#1a4fd199 0 12%,transparent 13%)}
.bd-memphis .bd-grain{background:
  radial-gradient(circle at 24% 30%,#ffd166cc 0 3px,transparent 4px) 0 0/21px 21px,
  repeating-linear-gradient(45deg,#ef476f33 0 4px,transparent 4px 10px)}
.bd-construct .bd-grain{background:
  linear-gradient(64deg,#0000 38%,#e6394633 40%,#0000 44%),
  linear-gradient(-64deg,#0000 60%,#1a1a1a40 62%,#0000 66%)}
.bd-gradient-sunset .bd-glow{background:linear-gradient(180deg,#ff9a5c00 30%,#ff5c8a3d 62%,#7a2bff3d 92%)}
.bd-news .bd-grain{background:repeating-linear-gradient(0deg,#00000010 0 1px,transparent 1px 4px)}
.bd-forest .bd-glow{background:
  radial-gradient(60% 50% at 24% 22%,#c8ff9a26,transparent 64%),
  linear-gradient(180deg,#0000 40%,#0d2a12 96%)}

/* ============================================================
   STONE FINISHES  .st-*
   ============================================================ */
.st-ceramic .core{box-shadow:inset -2px -3px 7px #0000002e,inset 3px 4px 9px #ffffff9c,0 3px 7px #00000042}
.st-matte .core{box-shadow:inset -2px -2px 8px #0000002b,inset 2px 3px 8px #ffffff5c,0 3px 8px #00000038;
  filter:saturate(.92) contrast(.96)}
.st-glass .core{box-shadow:inset 0 0 10px #ffffff5c,inset 0 -4px 12px #00000042,0 4px 12px #00000033;
  backdrop-filter:blur(2px) brightness(1.14);opacity:.94}
.st-metal .core{box-shadow:inset 0 0 12px #ffffff70,inset 0 -5px 10px #00000052,0 3px 9px #00000042;
  background-image:linear-gradient(150deg,#ffffff8f 8%,#ffffff00 36%,#ffffff4d 52%,#ffffff00 74%)}
.st-jade .core{box-shadow:inset 0 0 14px #7fe3c0aa,inset 0 -5px 12px #0a3a2e7a,0 3px 10px #0006;opacity:.95}
.st-neon .core{box-shadow:inset 0 0 10px #fff,0 0 14px var(--glow,#0ff),0 0 30px var(--glow,#0ff);
  border:1px solid color-mix(in srgb,var(--glow,#0ff) 70%,#fff)}
.st-ink .core{box-shadow:inset 0 0 16px #00000059;filter:blur(.4px) contrast(1.1)}
.st-pearl .core{background-image:conic-gradient(from 200deg,#ffffff00,#ffffff73,#ffffff00 40%,#ffe9c773,#ffffff00 78%);
  box-shadow:inset 0 0 12px #ffffff8a,0 3px 9px #0003}
.st-holo .core{background-image:linear-gradient(120deg,#ff5ea8b3,#ffd45eb3 26%,#5effc0b3 52%,#5ec8ffb3 76%,#c05effb3);
  box-shadow:inset 0 0 10px #fff9,0 3px 10px #0003;mix-blend-mode:normal}
.st-pixel .core{border-radius:22%;box-shadow:inset -3px -3px 0 #00000047,inset 3px 3px 0 #ffffff6b,0 3px 0 #0000003d}
.st-ember .core{box-shadow:inset 0 -6px 12px #ff7a1a99,inset 0 0 8px #ffd08a80,0 0 14px #ff7a1a6b}
.st-crystal .core{background-image:conic-gradient(from 130deg,#ffffff9e,#ffffff00 26%,#ffffff7a 50%,#ffffff00 74%,#ffffff8a);
  box-shadow:inset 0 0 12px #fff6,0 3px 10px #0004}
.st-chrome .core{background-image:linear-gradient(160deg,#ffffffd9 6%,#8f9aa3 34%,#e8eef2 48%,#6b757d 62%,#ffffffb3 88%);
  box-shadow:inset 0 0 8px #ffffff9e,0 3px 9px #0005}
.st-clay .core{box-shadow:inset -2px -3px 9px #0000002e,inset 2px 3px 8px #ffffff40,0 4px 9px #0003;
  filter:saturate(1.05)}
.st-paper .core{box-shadow:inset 2px 2px 0 #ffffff73,inset -2px -2px 0 #00000033,0 4px 8px #0003;
  border-radius:38% 62% 55% 45%/48% 42% 58% 52%}
.st-gem .core{box-shadow:inset 0 0 0 1px #ffffff5c,inset 0 0 16px #fff8,0 0 12px var(--glow,#fff5);
  background-image:conic-gradient(from 45deg,#ffffffbd,#ffffff00 22%,#ffffff9e 44%,#ffffff00 66%,#ffffffb3)}
.st-plasma .core{box-shadow:inset 0 0 18px #ffffffcc,0 0 18px var(--glow,#9f6bff),0 0 36px color-mix(in srgb,var(--glow,#9f6bff) 60%,transparent)}
.st-obsidian .core{box-shadow:inset 0 0 14px #ffffff2e,inset 0 -6px 14px #000000d9,0 3px 10px #000a;
  background-image:linear-gradient(150deg,#ffffff3d 4%,#00000000 30%,#ffffff26 48%,#00000000 72%)}
.st-cloud .core{box-shadow:inset 0 0 20px #ffffffa6,0 0 16px #ffffff3d;filter:blur(.35px)}
.st-candy .core{box-shadow:inset -3px -4px 10px #ff9ac24d,inset 3px 4px 12px #ffffffd9,0 4px 10px #0000002e}
.st-velvet-stone .core{box-shadow:inset -2px -3px 10px #00000040,inset 2px 3px 7px #ffffff2e,0 5px 12px #00000047;filter:contrast(1.05)}
.st-ember-glow .core{box-shadow:0 0 16px var(--glow,#ff7a1a8c),inset 0 0 10px #fff3}
.st-wood-stone .core{background-image:repeating-linear-gradient(78deg,#00000014 0 2px,#00000000 2px 5px);
  box-shadow:inset 0 0 10px #00000040,0 3px 8px #00000038}

/* ============================================================
   MOTION  .mo-*   (board-level and stone-level, composable)
   ============================================================ */
/* board motion */
.mo-drift .bd-grain{animation:mo-drift 26s linear infinite}
@keyframes mo-drift{to{background-position:340px 180px}}
.mo-drift-slow .bd-grain{animation:mo-drift 52s linear infinite}
.mo-aurora .bd-glow{animation:mo-aurora 14s ease-in-out infinite alternate}
@keyframes mo-aurora{from{transform:translate3d(-6%,-3%,0) scale(1.08);opacity:.5}to{transform:translate3d(6%,4%,0) scale(1.16);opacity:.95}}
.mo-twinkle .bd-grain{animation:mo-twinkle 4.6s ease-in-out infinite}
@keyframes mo-twinkle{0%,100%{opacity:.42;filter:brightness(1)}50%{opacity:1;filter:brightness(1.5)}}
.mo-ripple .bd-glow{animation:mo-ripple 7s ease-out infinite}
@keyframes mo-ripple{0%{transform:scale(.35);opacity:.75}100%{transform:scale(1.9);opacity:0}}
.mo-scan .bd-glow{background:repeating-linear-gradient(0deg,#ffffff00 0 6px,#ffffff2e 6px 8px);animation:mo-scan 5.5s linear infinite}
@keyframes mo-scan{to{background-position:0 120px}}
.mo-pulse-grid .lines{animation:mo-pulse-grid 5s ease-in-out infinite}
@keyframes mo-pulse-grid{0%,100%{opacity:.7;filter:brightness(1)}50%{opacity:1;filter:brightness(1.5)}}
.mo-shimmer .bd-grain{background:linear-gradient(72deg,#fff3c400 34%,#fff3c4b3 48%,#fff3c400 62%);animation:mo-shimmer 5.5s ease-in-out infinite}
@keyframes mo-shimmer{0%{transform:translateX(-40%);opacity:.2}55%{opacity:1}100%{transform:translateX(40%);opacity:.2}}
.mo-swirl .bd-glow{animation:mo-swirl 34s linear infinite}
@keyframes mo-swirl{to{transform:rotate(360deg) scale(1.25)}}
.mo-haze .bd-glow{animation:mo-haze 8s ease-in-out infinite alternate;filter:blur(7px)}
@keyframes mo-haze{from{transform:translateY(-4%) scaleY(1)}to{transform:translateY(5%) scaleY(1.1)}}
.mo-snow .bd-grain{background-image:radial-gradient(circle,#fff 0 1.5px,transparent 2px);background-size:26px 26px;animation:mo-snow 12s linear infinite}
@keyframes mo-snow{to{background-position:26px 240px}}
.mo-inkspread .bd-glow{animation:mo-inkspread 12s ease-in-out infinite alternate}
@keyframes mo-inkspread{from{transform:scale(.9);opacity:.6}to{transform:scale(1.22);opacity:1}}
.mo-flicker .bd-glow{background:linear-gradient(0deg,#00f0ff33,#ff00c833);animation:mo-flicker 3.4s steps(1,end) infinite}
@keyframes mo-flicker{0%,58%{opacity:.85}60%{opacity:.3}62%{opacity:.9}74%{opacity:.42}76%{opacity:1}}
.mo-dust .bd-grain{background-image:radial-gradient(circle,#ffffff8c 0 1px,transparent 1.6px),radial-gradient(circle,#ffffff40 0 1.4px,transparent 2px);
  background-size:38px 38px,61px 61px;animation:mo-dust 22s linear infinite}
@keyframes mo-dust{to{background-position:60px -180px,-90px -240px}}
.mo-caustics .bd-glow{background:repeating-linear-gradient(96deg,#ffffff00 0 26px,#a8e6ff2e 26px 40px,#ffffff00 40px 66px);
  animation:mo-caustics 13s ease-in-out infinite alternate}
@keyframes mo-caustics{from{transform:translateX(-8%) skewX(-6deg)}to{transform:translateX(8%) skewX(6deg)}}
.mo-sweep .bd-glow{background:linear-gradient(115deg,#ffffff00 38%,#ffffff73 50%,#ffffff00 62%);animation:mo-sweep 4.4s ease-in-out infinite}
@keyframes mo-sweep{0%{transform:translateX(-70%)}70%,100%{transform:translateX(70%)}}
.mo-glow-breathe .bd-glow{animation:mo-glow-breathe 6.2s ease-in-out infinite}
@keyframes mo-glow-breathe{0%,100%{opacity:.35;filter:brightness(1)}50%{opacity:.85;filter:brightness(1.45)}}
.mo-float .bd-glow{animation:mo-float 11s ease-in-out infinite alternate}
@keyframes mo-float{from{transform:translate3d(-3%,2%,0)}to{transform:translate3d(3%,-3%,0)}}
.mo-bloom .bd-glow{animation:mo-bloom 9s ease-in-out infinite alternate}
@keyframes mo-bloom{from{filter:saturate(.8) blur(4px)}to{filter:saturate(1.5) blur(9px)}}

/* stone motion — the mo-* class is applied to the stone itself */
.stone.mo-drop{animation:mo-drop 1.05s cubic-bezier(.24,1.5,.36,1) both}
@keyframes mo-drop{0%{transform:translate(-50%,-140%) scale(.55);opacity:0}62%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
.stone.mo-breathe{animation:mo-breathe 4.2s ease-in-out infinite}
@keyframes mo-breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.075)}}
.mo-orbit .core{background-image:conic-gradient(from 0deg,#ffffff00 60%,#ffffffb3 78%,#ffffff00 92%);animation:mo-orbit 3.6s linear infinite}
@keyframes mo-orbit{to{transform:rotate(360deg)}}
.mo-echo .core,.mo-ripple-stone .core{animation:mo-echo 3.2s ease-out infinite}
@keyframes mo-echo{0%{box-shadow:0 0 0 0 #ffffff73}100%{box-shadow:0 0 0 16px #ffffff00}}
.mo-sparkle .core{animation:mo-sparkle 2.9s ease-in-out infinite}
@keyframes mo-sparkle{0%,100%{filter:brightness(1)}45%{filter:brightness(1.9) saturate(1.3)}}
.stone.mo-liquid{animation:mo-liquid 6.4s ease-in-out infinite;border-radius:44% 56% 58% 42%/50% 44% 56% 50%}
@keyframes mo-liquid{0%,100%{border-radius:44% 56% 58% 42%/50% 44% 56% 50%}50%{border-radius:56% 44% 42% 58%/46% 56% 44% 54%}}
.stone.mo-sway{animation:mo-sway 5.6s ease-in-out infinite}
@keyframes mo-sway{0%,100%{transform:translate(-50%,-50%) rotate(-3.5deg)}50%{transform:translate(-50%,-50%) rotate(3.5deg)}}
.mo-charge .core{animation:mo-charge 3.4s ease-in-out infinite}
@keyframes mo-charge{0%,100%{filter:brightness(1);opacity:.92}48%{filter:brightness(2.1) blur(.4px);opacity:1}}
.stone.mo-hover-stone{animation:mo-hover-stone 5.2s ease-in-out infinite}
@keyframes mo-hover-stone{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}
.stone.mo-glow-soft{animation:mo-glow-soft 5.8s ease-in-out infinite alternate}
@keyframes mo-glow-soft{from{filter:drop-shadow(0 0 2px var(--glow,#fff3))}to{filter:drop-shadow(0 0 12px var(--glow,#fff8))}}

@media (prefers-reduced-motion:reduce){
  .card *,.card *::before,.card *::after{animation:none!important}
}

/* ---------- solo lightbox ---------- */
#solo{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;
  background:color-mix(in srgb,var(--page) 72%,#000);backdrop-filter:blur(10px)}
#solo[hidden]{display:none}
#solo .solo-card{width:min(74vh,560px);border-radius:22px;overflow:hidden;
  border:1px solid var(--card-edge);box-shadow:0 34px 90px #0009;background:var(--card);animation:solo-in .32s cubic-bezier(.2,.9,.24,1)}
@keyframes solo-in{from{transform:scale(.94);opacity:0}}
#solo .solo-card .board{border-radius:0}
#solo .solo-meta{padding:14px 16px 16px;position:relative}
#solo .solo-meta b{display:block;font:400 19px/1.2 var(--font-display);margin-bottom:6px}
#solo .solo-meta small{color:var(--muted);font-size:12px;line-height:1.55}
#solo .solo-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--card-edge);background:transparent;color:var(--ink);font-size:15px;cursor:pointer}
#solo .solo-tags{padding:0 16px 16px;display:flex;gap:6px;flex-wrap:wrap}
#solo .solo-tags span{font:600 10px/1 var(--font-ui);letter-spacing:.1em;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:7px}
#solo .solo-copy{margin-top:12px;width:100%;min-height:36px;border-radius:10px;cursor:pointer;
  border:1px solid var(--card-edge);background:transparent;color:var(--muted);font:600 11.5px/1 var(--font-ui);transition:.18s}
#solo .solo-copy:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="counter" id="counter">BOARD APPEARANCE LAB</div>
      <h1>棋盘外观探索 · <em id="total">100</em> 个动效主题</h1>
      <p>每张卡是一套「棋盘材质 + 棋子质感 + 动效 + 配色」组合，独立于软件现有主题，用于挑选下一步的外观方向。全部为纯 CSS 实现，无外部资源；点击卡片可放大预览。</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="chip ghost" id="surfaceToggle">切换页面底色</button>
      <button class="chip ghost" id="motionToggle" aria-pressed="true">动效：开</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="chip" data-fam="__all" aria-pressed="true">全部</div>
    <div class="sep"></div>
    <div id="fams" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>

  <main class="grid" id="grid"></main>
</div>

<div id="solo" hidden aria-modal="true" role="dialog"></div>

<script src="themes-core.js"></script>
<script src="themes-batch-a.js"></script>
<script src="themes-batch-b.js"></script>
<script src="themes-batch-c.js"></script>
<script src="themes-batch-d.js"></script>
<script>
/* ---------- renderer ---------- */
(function () {
  var themes = []
    .concat(window.BOARD_THEMES_CORE || [])
    .concat(window.BOARD_THEMES_A || [])
    .concat(window.BOARD_THEMES_B || [])
    .concat(window.BOARD_THEMES_C || [])
    .concat(window.BOARD_THEMES_D || []);

  var grid = document.getElementById("grid");
  var fams = document.getElementById("fams");
  var counter = document.getElementById("counter");
  document.getElementById("total").textContent = String(themes.length);

  var DEFAULT_MOVES = [[4, 4], [3, 4], [5, 5], [4, 5], [3, 3], [5, 3]];
  var STARS = { 9: [[2, 2], [2, 6], [4, 4], [6, 2], [6, 6]], 11: [[2, 2], [2, 8], [5, 5], [8, 2], [8, 8]], 13: [[3, 3], [3, 9], [6, 6], [9, 3], [9, 9]], 15: [[3, 3], [3, 11], [7, 7], [11, 3], [11, 11]] };

  /* ---- contrast helpers: decide when a stone needs an adaptive rim ---- */
  function hexRgb(value) {
    if (!value) return null;
    var h = String(value).replace("#", "").trim();
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    if (h.length < 6) return null;
    return [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16); });
  }
  function relLum(rgb) {
    var f = function (v) { var s = v / 255; return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
  }
  function contrast(a, b) {
    if (!a || !b) return 99;
    var la = relLum(a), lb = relLum(b);
    var hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }
  function edgeFlags(theme) {
    var v = theme.vars || {};
    var b1 = hexRgb(v["bd-1"]), b2 = hexRgb(v["bd-2"]);
    if (!b1 || !b2) return { black: false, white: false };
    var base = b1.map(function (c, i) { return Math.round((c + b2[i]) / 2); });
    return {
      black: contrast(hexRgb(v["s-black"]) || [17, 17, 17], base) < 2.6,
      white: contrast(hexRgb(v["s-white"]) || [240, 240, 240], base) < 1.45,
      glow: v.glow,
    };
  }

  function board(theme) {
    var n = theme.size || 9;
    var el = document.createElement("div");
    el.className = "board bd-" + (theme.board || "wood") + " " + (theme.motion || []).map(function (m) { return "mo-" + m; }).join(" ");
    el.style.setProperty("--n", n);
    el.style.setProperty("--pad", theme.pad || 6);
    var v = theme.vars || {};
    ["bd-1", "bd-2", "ln", "star", "s-black", "s-black-2", "s-white", "glow", "grain-opacity", "grain-blend", "line-filter", "frame", "frame-w", "star-size", "star-glow", "stone-scale"].forEach(function (k) {
      if (v[k] != null) el.style.setProperty("--" + k, v[k]);
    });
    ["bd-layer", "bd-grain", "bd-glow", "lines", "frames"].forEach(function (cls) {
      var d = document.createElement("div"); d.className = cls; el.appendChild(d);
    });
    (STARS[n] || STARS[9]).forEach(function (p) {
      var s = document.createElement("i"); s.className = "star";
      s.style.left = "calc(var(--pad) + " + (p[1] / (n - 1)) + " * (100% - var(--pad)*2))";
      s.style.top = "calc(var(--pad) + " + (p[0] / (n - 1)) + " * (100% - var(--pad)*2))";
      el.appendChild(s);
    });
    var stones = document.createElement("div"); stones.className = "stones";
    var edge = edgeFlags(theme);
    if (edge.glow) el.style.setProperty("--glow", v.glow || edge.glow);
    (theme.moves || DEFAULT_MOVES).forEach(function (m, i) {
      var st = document.createElement("span");
      var player = m[2] || (i % 2 === 0 ? "black" : "white");
      st.className = "stone " + player + " st-" + (theme.stone || "ceramic");
      if (player === "black" && edge.black) {
        st.className += " edge-black";
        if (edge.glow) st.style.setProperty("--edge-black", edge.glow);
      }
      if (player === "white" && edge.white) {
        st.className += " edge-white";
      }
      if (theme.stoneMotion && theme.stoneMotion[i % theme.stoneMotion.length]) st.className += " mo-" + theme.stoneMotion[i % theme.stoneMotion.length];
      st.style.left = "calc(var(--pad) + " + (m[1] / (n - 1)) + " * (100% - var(--pad)*2))";
      st.style.top = "calc(var(--pad) + " + (m[0] / (n - 1)) + " * (100% - var(--pad)*2))";
      st.style.animationDelay = (0.25 + i * 0.12) + "s";
      var core = document.createElement("i"); core.className = "core";
      if (v.glow) core.style.setProperty("--glow", v.glow);
      st.appendChild(core);
      stones.appendChild(st);
    });
    el.appendChild(stones);
    return el;
  }

  function card(theme, index) {
    var fig = document.createElement("figure");
    fig.className = "card";
    fig.dataset.fam = theme.family || "其他";
    fig.dataset.idx = String(index);
    fig.dataset.motions = (theme.motion || []).concat(theme.stoneMotion || []).join(" ");
    fig.appendChild(board(theme));
    var cap = document.createElement("figcaption");
    cap.innerHTML = '<span class="no">' + String(index + 1).padStart(3, "0") + '</span>'
      + '<b>' + theme.name + '</b>'
      + '<span class="fam">' + (theme.family || "其他") + '</span>'
      + '<small>' + (theme.note || "") + '</small>';
    fig.appendChild(cap);
    return fig;
  }

  themes.forEach(function (t, i) { grid.appendChild(card(t, i)); });

  /* families */
  var seen = [];
  themes.forEach(function (t) { if (seen.indexOf(t.family) < 0) seen.push(t.family); });
  seen.forEach(function (f) {
    var b = document.createElement("div");
    b.className = "chip"; b.dataset.fam = f; b.textContent = f; b.setAttribute("aria-pressed", "false");
    fams.appendChild(b);
  });

  function applyFilter(fam) {
    var shown = 0;
    grid.querySelectorAll(".card").forEach(function (c) {
      var ok = fam === "__all" || c.dataset.fam === fam;
      c.style.display = ok ? "" : "none";
      if (ok) shown += 1;
    });
    counter.textContent = "BOARD APPEARANCE LAB · 显示 " + shown + " / " + themes.length;
  }
  document.querySelectorAll(".chip[data-fam]").forEach(function (chip) {
    chip.addEventListener("click", function () {
      document.querySelectorAll(".chip[data-fam]").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
      chip.setAttribute("aria-pressed", "true");
      applyFilter(chip.dataset.fam);
    });
  });
  applyFilter("__all");

  /* reveal + run motion only while visible */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("shown"); }
    });
  }, { rootMargin: "120px" });
  grid.querySelectorAll(".card").forEach(function (c) { io.observe(c); });

  /* whole-page motion switch + surface switch */
  document.getElementById("motionToggle").addEventListener("click", function () {
    var on = this.getAttribute("aria-pressed") === "true";
    this.setAttribute("aria-pressed", String(!on));
    this.textContent = "动效：" + (!on ? "开" : "关");
    document.querySelectorAll(".board").forEach(function (b) { b.style.animationPlayState = !on ? "paused" : ""; });
    document.body.classList.toggle("no-motion", on);
    var style = document.getElementById("killmotion");
    if (!style) { style = document.createElement("style"); style.id = "killmotion"; document.head.appendChild(style); }
    style.textContent = on ? ".board *,.board *::before,.board *::after{animation:none!important}" : "";
  });
  document.getElementById("surfaceToggle").addEventListener("click", function () {
    var root = document.documentElement;
    root.dataset.surface = root.dataset.surface === "dark" ? "light" : "dark";
  });

  /* click to inspect one theme large (15x15 with centered stones) */
  var BIG_MOVES = [[7, 7], [6, 7], [8, 8], [7, 8], [6, 6], [8, 6], [5, 7], [9, 8]];
  var solo = document.getElementById("solo");
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  function closeSolo() { solo.hidden = true; solo.innerHTML = ""; }
  grid.addEventListener("click", function (e) {
    var fig = e.target.closest(".card");
    if (!fig) return;
    var theme = themes[Number(fig.dataset.idx)];
    if (!theme) return;
    var big = Object.assign({}, theme, { size: 15, pad: 5, moves: BIG_MOVES });
    var wrap = document.createElement("div");
    wrap.className = "solo-card";
    wrap.appendChild(board(big));
    var meta = document.createElement("div");
    meta.className = "solo-meta";
    meta.innerHTML = '<b>' + theme.name + '</b><small>' + (theme.note || "") + '</small>'
      + '<button class="solo-close" aria-label="关闭">✕</button>'
      + '<button class="solo-copy" type="button">复制该主题数据</button>';
    wrap.appendChild(meta);
    meta.querySelector(".solo-copy").addEventListener("click", function () {
      var btn = this;
      var text = JSON.stringify(theme, null, 2);
      var done = function () { btn.textContent = "已复制 ✓"; setTimeout(function () { btn.textContent = "复制该主题数据"; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
      } else { legacyCopy(text); done(); }
    });
    var tags = document.createElement("div");
    tags.className = "solo-tags";
    tags.innerHTML = '<span>' + (theme.family || "") + '</span>'
      + '<span>棋盘 ' + (theme.board || "") + '</span>'
      + '<span>棋子 ' + (theme.stone || "") + '</span>'
      + (theme.motion || []).concat(theme.stoneMotion || []).map(function (m) { return '<span>' + m + '</span>'; }).join("");
    wrap.appendChild(tags);
    solo.innerHTML = "";
    solo.appendChild(wrap);
    solo.hidden = false;
  });
  solo.addEventListener("click", function (e) {
    if (e.target === solo || e.target.closest(".solo-close")) closeSolo();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSolo(); });
})();
</script>
</body>
</html>
